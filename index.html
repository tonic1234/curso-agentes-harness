{t:'Turno 2: el prefijo viene de la caché',why:'El modelo no «recuerda»: el programa reenvía la conversación entera. Si el prefijo es idéntico, el proveedor lo lee de la caché a una fracción del precio.'},
{t:'Turno 3: las salidas de comandos engordan',why:'Cada resultado de herramienta se suma al historial y se vuelve a enviar en todos los turnos siguientes. Un log gigante se paga muchas veces.'},
{t:'Turno 4: la caché venció',why:'La caché dura minutos (5 por defecto, 1 hora si la pedís). Si pasa el tiempo, o cambiás las herramientas o el prefijo, se vuelve a pagar todo.'},

n:{g:'Dibujá en el pizarrón dos columnas: «lo que escribo» y «lo que se envía». La segunda crece cada turno. Es la idea que explica casi todas las palancas.',c:'Documentación de caché de prompts de Anthropic: lectura de caché a 0,1× del precio de entrada (0,05× en Opus 5.5 y Sonnet 5.5), escritura a 1,25× para 5 minutos o 2× para 1 hora; el orden es herramientas, sistema, mensajes, y cambiar las definiciones de herramientas invalida lo posterior. Los multiplicadores pueden cambiar: mirá la página de precios.',s:[['Anthropic · Prompt caching','https://docs.claude.com/en/docs/build-with-claude/prompt-caching']]}});

P({type:'concept',mod:10,eb:'Palancas · elegir quién y cuánto',title:'Cinco palancas *que sí cambian el resultado*',lead:'Estas pueden bajar la calidad si se usan mal. Por eso cada una se acepta con la puerta, no con la intuición.',table:{head:['Palanca','Qué hace','Evidencia'],rows:[
['Modelo por rol','Subagente explorador en un modelo chico; planificar con el fuerte y ejecutar con el medio (opusplan).','Configuración documentada; el ahorro depende de tu mezcla'],

['Routing por tarea','Decidir el modelo por dificultad. RouteLLM: hasta más de 85 % menos costo en MT-Bench conservando 95 % de la calidad de GPT-4.','Medido por sus autores, en sus benchmarks']]},

P({type:'anim',mod:10,eb:'Animación · el router',title:'Una decisión barata, *una puerta* y una red',diagram:'router',dw:'900px',steps:[
{t:'Llega una tarea',why:'Todavía no sabemos si es fácil o difícil. Usar siempre el modelo fuerte paga de más; usar siempre el chico falla las difíciles.'},
{t:'El router decide barato',why:'Una llamada corta y rápida clasifica la tarea y devuelve también cuán seguro está. No escribe código: sólo elige el nivel.'},
{t:'Se elige un nivel',why:'Chico para lo local y obvio, medio para la mayoría, fuerte para diseño o ambigüedad. Los nombres de modelo los mapeás vos.'},
{t:'La puerta verifica',why:'Las pruebas deciden si el resultado cuenta. El router apuesta; la puerta es la red de seguridad.'},
{t:'Si falla, sube',why:'La cascada sube de nivel hasta el fuerte. Si escala mucho, el router está mal calibrado: lo ves en el registro.'},
{t:'Si el router duda, no adivina',why:'Con baja confianza o si el servicio falla, la tarea va directo al fuerte. Es la falla abierta: pagás de más, nunca entregás peor.'}],
n:{g:'Remarcá dos ideas: la puerta (sin ella el router es una apuesta) y la falla abierta (el router nunca puede empeorar el resultado, sólo el costo).',c:'Patrón de cascada con puerta y política de confianza act, escalate, abstain tomada del proyecto jev-fastloop; falla abierta («si el router falla, hacé lo caro») también de ese proyecto. Es un patrón de ingeniería, no una garantía.',s:[['jev-fastloop','https://github.com/SupremeDreamZ/jev-fastloop']]}});
P({type:'concept',mod:10,eb:'Cuatro formas de rutear',title:'De la más simple *a la más fina*',cards:[

{k:'2 · Por reglas',h:'Tamaño, palabras, archivos',p:'Barato y rápido, pero frágil: el tamaño de un pedido no es su dificultad. Un «renombrar» corto puede tocar veinte módulos.'},
{k:'3 · Aprendido',h:'Entrenado con preferencias',p:'RouteLLM: funciona en sus benchmarks y rinde mal con datos distintos hasta que se aumenta con ejemplos propios.'},
{k:'4 · Capa de decisión',h:'Preguntas tipadas con confianza',p:'Jev: devuelve una elección, probabilidades y confianza en milisegundos. Con umbral y puerta, es la pieza del router que construimos.',c:'hl'}],

P({type:'concept',mod:10,eb:'Jev · TypeSafe AI',title:'Un modelo que *decide* y no escribe',cards:[
{k:'Qué es',h:'Entra un estado, salen decisiones',p:'Recibís un texto y preguntas con tipo. Devuelve respuestas tipadas con probabilidades. No genera texto libre ni hay streaming.'},
{k:'Tres tipos de pregunta',h:'choice, score, noul',p:'choice: una opción entre hasta 255, con probabilidades y confianza. score: una escala ordenada de 2 a 10 niveles. noul: sí o no con probabilidad.'},
{k:'Qué dice el proveedor',h:'70 a 500 ms y 0,042 USD por millón',p:'Latencia y precio de entrada según TypeSafe y la lista de OpenCode Zen (salida gratis; hay una variante gratuita por tiempo limitado). Son cifras del proveedor.'},
{k:'Límites',h:'Leelos antes de usarlo',p:'Sólo texto, inglés como idioma principal, acceso temprano, ventana de 32 000 tokens según un gateway comunitario. La confianza no es la probabilidad de acertar.',c:'hl'}],
n:{g:'Explicá la diferencia con un LLM: Jev es un clasificador con tipos garantizados. Que la salida sea del tipo correcto no significa que sea correcta. Por eso hay umbral y puerta.\n\nSi alguien lo prueba en español, que lo anote: la documentación lo da como inglés principal.',c:'Páginas de OpenCode Zen y del proveedor consultadas el 30 de octubre de 2026. Endpoint en Zen: https://opencode.ai/inference/systemone/v1/systemone, modelos jev-1.13 y jev-1.13-free. Respuesta: answers por nombre de pregunta con type, choice, probabilities y confidence, y usage. El campo confidence es una medida de concentración del proveedor, no una probabilidad calibrada de acierto.',s:[['OpenCode Zen','https://opencode.ai/docs/zen'],['Zuplo · Using Jev','https://zuplo.com/docs/ai-gateway/jev']]}});
P({type:'concept',mod:10,eb:'Jev en la práctica · tres casos',title:'Qué se midió *y quién lo midió*',lead:'Los dos proyectos comunitarios son pequeños y de un solo autor. Sirven para aprender el patrón, no como prueba de rendimiento.',table:{head:['Caso','Qué hace','Lo que se sabe'],rows:[
['Router de modelos (lo que armamos)','Jev clasifica la tarea y elige el nivel; la puerta verifica y escala.','Ninguna medición pública conocida: la medís con tu examen'],
['jev-gateway (vinilana)','Proxy local para Claude Code y Codex donde Jev elige la herramienta de cada turno.','Sin cifras medidas; el autor estima 0,5 a 1 s por turno con herramientas'],
['jev-fastloop (SupremeDreamZ)','Política act, escalate, abstain con falla abierta, registro JSONL y router de 1 248 skills.','Medido por el autor en muestras chicas: 0,6 a 1,3 s por llamada']]},
note:'El proyecto jev-fastloop cita que descomponer un juicio en preguntas simples rinde mucho más que una sola pregunta (62,6 % contra cerca de 95 %). Es una cifra citada que no reprodujimos: aprovechá la idea, no el número.',
n:{g:'Hacé notar la tensión: el proveedor dice 70 a 500 ms; en el gateway el autor estima 0,5 a 1 s por turno. «A toda velocidad» depende de dónde corras y qué midas: midan la latencia en su red.\n\nIdea transferible: preguntas atómicas (dificultad, alcance) en vez de una pregunta que mezcle todo.',c:'jev-gateway: Node 22.15 o superior, modos direct, forced, hint, none y passthrough, timeout por defecto de 4 000 ms, límites de 32 000 tokens, inglés y una herramienta por turno; en Claude Code el modo hint mejora exactitud, no costo ni latencia. jev-fastloop: 1 estrella y 2 commits al consultarlo; mediciones del propio autor. Ambos se presentan como ejemplos del patrón.',s:[['jev-gateway','https://github.com/vinilana/jev-gateway'],['jev-fastloop','https://github.com/SupremeDreamZ/jev-fastloop']]}});
P({type:'build',foot:'↓ ↑ avanzan los pasos · después: cómo pedírselo a tu asistente',mod:10,eb:'Construcción · ruteo.py',title:'Un router *con umbral, puerta y falla abierta*',lead:'Cinco bloques. Jev responde con probabilidades; tu código decide qué hacer con ellas.',file:'ruteo.py',cw:'860px',steps:[
{t:'Niveles, modelos y umbral',why:'Tres niveles ordenados por costo. El umbral de confianza arranca conservador y se ajusta con el registro.',code:'NIVELES = ["chico", "medio", "fuerte"]\nMODELOS = {"chico": "haiku",\n           "medio": "sonnet",\n           "fuerte": "opus"}\nUMBRAL = 0.75'},
{t:'Preguntas atómicas',why:'Dos preguntas simples valen más que una que mezcle todo. Cada opción lleva un criterio escrito.',code:'\nPREGUNTAS = {"dificultad": {\n  "type": "choice",\n  "instructions": "¿Qué tan difícil es?",\n  "criteria": {"facil": "...",\n               "normal": "...",\n               "dificil": "..."}},\n  "alcance": {...}}'},
{t:'Elegir con falla abierta',why:'Si Jev falla, tarda o duda, se usa el modelo fuerte. El router sólo puede encarecer, nunca empeorar.',code:'\ndef elegir_nivel(tarea):\n    try:\n        r = decidir(tarea, PREGUNTAS)\n    except Exception:\n        return "fuerte", "jev-fallo"\n    conf = min(r["dificultad"]["confidence"],\n               r["alcance"]["confidence"])\n    if conf < UMBRAL:\n        return "fuerte", "baja-confianza"\n    ...'},
{t:'Puerta y cascada',why:'El resultado sólo cuenta si pasan las pruebas. Si no, se sube de nivel hasta el fuerte.',code:'\ndef resolver(tarea, correr, puerta):\n    nivel, motivo = elegir_nivel(tarea)\n    for n in NIVELES[NIVELES.index(nivel):]:\n        res = correr(MODELOS[n], tarea)\n        if puerta(res):\n            break'},
{t:'Registro de decisiones',why:'Una línea por decisión. Después etiquetás cuáles fueron correctas y calibrás el umbral con datos reales.',code:'\n    with open("ruteo-decisiones.jsonl", "a") as f:\n        f.write(json.dumps({\n            "elegido": nivel,\n            "motivo": motivo,\n            "intentos": intentos}) + "\\n")'}],
n:{g:'Mostrá el archivo completo en la receta que sigue. Hacé hincapié en el try/except: es la decisión de diseño más importante.',c:'Estructura inspirada en el patrón de jev-fastloop (política de confianza y falla abierta). El código completo de referencia se probó con un Jev simulado: tarea fácil, difícil, poca confianza, servicio caído y escalada por puerta.'}});

P({type:'activity',mod:10,eb:'Actividad 10 · Ruteá y medí',title:'Probá el ruteo *contra tu examen*',scenario:'Con el examen de la unidad 7, compará «todo en el modelo medio» contra una asignación por nivel. La única regla que cuenta: aprueba lo mismo y el costo por tarea aprobada baja.',total:25,steps:[[5,'Clasificá a mano cada tarea de tu examen en chico, medio o fuerte, y anotá por qué.'],[12,'Corré el examen dos veces: todo en el modelo medio (línea base) y con tu asignación. Registrá tarea, corrida, paso y costo en un CSV.'],[5,'Corré comparar-costo.sh con los dos CSV y leé la decisión.'],[3,'Si rechazó, anotá qué tarea falló y subí su nivel. Si aceptó, ¿qué escaló más de lo esperado?']],gate:'La decisión sale ACEPTADA con la regla del script: aprueba lo mismo o más, el costo por tarea aprobada baja al menos 30 % y ninguna tarea estable falla.',kpi:'Costo por tarea aprobada, cantidad de escaladas y tareas estables que fallaron.',deliver:'Dos CSV, la salida del script y una línea con el veredicto.',trap:'Comparar precio por token en vez de costo por tarea aprobada, o medir sólo tareas fáciles.',mode:'Parejas · 25 min',
n:{g:'Si hay poco tiempo, usen la asignación por rol (sin Jev) como router. La lección es la regla de decisión, no la herramienta.\n\nVa a haber equipos que rechacen su propio ruteo: es un resultado válido y vale más que un ahorro sin puerta.',c:'El script acepta sólo si las aprobadas son iguales o mayores, el costo por tarea aprobada baja 30 % o más y ninguna tarea estable empieza a fallar. El umbral de 30 % es una convención del curso: ajustalo a tu contexto.'}});
P({type:'quiz',mod:10,id:'q10',title:'Economía del token · *explicá el porqué*',qs:[
{q:'En una sesión larga, ¿por qué crece el costo de cada turno aunque tus preguntas sean cortas?',o:['Porque el modelo se vuelve más caro con el uso','Porque cada turno reenvía la conversación completa, incluidas las salidas de comandos','Porque las preguntas cortas cuestan más','Porque la caché cobra por turno'],a:1,w:'El modelo no guarda estado: el programa reenvía el historial. El costo depende del largo de la conversación por el número de turnos.'},
{q:'Un equipo cambia la lista de herramientas a mitad de la sesión y el gasto sube. ¿Qué pasó?',o:['La caché de prompt se invalidó','El modelo cambió solo','Subió el precio por token','Se agotó la ventana de contexto'],a:0,w:'El orden es herramientas, sistema y mensajes. Cambiar las herramientas invalida todo lo que viene después, y hay que pagar de nuevo la entrada completa.'},
{q:'Un router manda el 80 % de las tareas al modelo chico y la factura baja 80 %. ¿Qué falta para decir que ahorraron?',o:['Nada, el ahorro es evidente','Saber cuántas tareas siguen aprobando la puerta y cuánto cuesta cada una aprobada','Cambiar de proveedor','Usar un modelo todavía más chico'],a:1,w:'Si las tareas fallan o se reintentan, el costo por tarea aprobada puede subir. El ahorro se declara con la puerta, no con la factura.'},
{q:'Jev devuelve choice = «facil» con confianza 0,95. ¿Qué podés concluir?',o:['Que hay un 95 % de probabilidad de acertar','Que el modelo está muy concentrado en esa opción, no que acierte el 95 % de las veces','Que la tarea ya está resuelta','Que no hace falta puerta'],a:1,w:'La confianza es una medida de concentración del proveedor, no una probabilidad calibrada. Se usa como umbral y se verifica con un registro y una puerta.'},
{q:'¿Cuál es un mal uso de una capa de decisión como Jev?',o:['Clasificar la dificultad de una tarea','Elegir entre cinco skills','Pedirle que escriba la función y confiar en su salida','Decidir si escalar a una persona'],a:2,w:'Jev decide entre opciones tipadas; no genera texto libre. Para escribir código usás un modelo generativo, y la puerta verifica.'}],
n:{g:'Pedí que expliquen la tercera con el ejemplo de la tabla de precios. Es la confusión más común entre ahorrar y recortar.',c:'Las preguntas cubren caché de prompt, costo por tarea aprobada, confianza de Jev y el alcance de un modelo de decisión.'}});

P({type:'reflection',mod:10,id:'r10',title:'Lo que *ves* y lo que no',prompts:['¿Cuánto gasta hoy tu equipo en agentes y qué obtiene a cambio?','¿Qué dato de la telemetría no deberías exportar nunca y quién lo decide?','¿Qué número mirarías cada semana para saber si tus agentes mejoran?'],
n:{g:'Pedí que anoten una frecuencia (semanal, mensual) para mirar ese número. La observabilidad sin una rutina de lectura no cambia nada.',c:'La tercera pregunta es el puente con el demo day: los equipos van a mostrar su número.'}});

/* ---- U11 · Guidelines de la organización ---- */
P({type:'opener',mod:11,time:'15:15',dur:50,title:'Guidelines *para toda la organización*',lead:'Un agente bien diseñado ayuda a un equipo. Unas guidelines bien diseñadas ayudan a todos los agentes de la organización a respetar las mismas reglas.',goals:['Escribir documentación que los agentes puedan usar','Organizar las reglas por capas con un repo central','Hacerlas cumplir con chequeos y dueños'],take:'Una guideline propia con su chequeo de CI, lista para proponer al repo central.',
n:{g:'Pregunta de apertura: «¿Qué reglas de la organización respetan hoy los agentes de ustedes?». Casi siempre: ninguna, porque nadie se las dio de forma que puedan leer.\n\nLa idea de la unidad es simple: lo que logramos en un agente lo escalamos con documentación, un repositorio central y chequeos.',c:'Las guidelines funcionan como un «sistema operativo» de reglas: se definen una vez, se heredan por capas y se verifican automáticamente. El valor aparece cuando el cumplimiento deja de depender de la memoria de las personas.'}});

P({type:'glossary',mod:11,eb:'Glosario · unidad 11',title:'Seis términos *de gobierno*',terms:[
['Guideline','Regla o estándar de trabajo escrito para que personas y agentes lo respeten.',''],
['Repo central','Repositorio de la organización con guidelines, skills y plantillas que los demás reutilizan.',''],
['Herencia por capas','Organización, equipo, repo y tarea: cada capa agrega o ajusta, nunca contradice a la superior sin excepción.',''],
['Chequeo de cumplimiento','Verificación automática, por ejemplo en CI, de que un repo respeta la guideline.',''],
['Dueño','Persona o equipo responsable de mantener una guideline actualizada.','CODEOWNERS'],
['Excepción','Desvío aprobado y registrado de una guideline, con motivo y fecha de revisión.','']],
n:{g:'Insistí en «chequeo de cumplimiento»: una guideline sin chequeo es una sugerencia. Es el mismo principio que el Día 1: lo que importa se hace cumplir con un mecanismo.',c:'CODEOWNERS es un mecanismo de GitHub que asigna revisores obligatorios por ruta. Se usa aquí para dar dueño a las guidelines.'}});

P({type:'anim',mod:11,eb:'Animación · las capas',title:'Reglas *que se heredan*',diagram:'guide',dw:'900px',steps:[
{t:'Organización',why:'Un AGENTS.md raíz con lo que vale para todos: seguridad, modelos aprobados, formato de PR. Se mantiene en el repo central.'},
{t:'Equipo o dominio',why:'Convenciones de front, de back o de datos. Hereda la capa de arriba y la afina.'},
{t:'Repositorio',why:'El contrato del repo: comandos, zonas y decisiones propias. Es lo que el agente lee primero.'},
{t:'Tarea',why:'La spec concreta de una tarea. Hereda todo lo anterior.'},
{t:'El CI lo verifica',why:'Un chequeo automático falla si falta el contrato o si se rompe una zona. Sin esto, la guideline es una sugerencia.'}],
n:{g:'Construí el esquema de arriba hacia abajo y pedí un ejemplo de lo que iría en cada capa. Después, el último paso: el chequeo.\n\nConexión con el Día 1: el contrato del repo es el de ayer; hoy lo ubicamos como una capa dentro de un sistema.',c:'Las herramientas de agentes suelen soportar contratos en varias ubicaciones (global, del usuario, del repo, de subcarpeta) con reglas de precedencia propias. Conviene leer cómo las combina tu herramienta antes de diseñar las capas.',s:[['Claude Code · Memoria','https://docs.claude.com/en/docs/claude-code/memory']]}});

P({type:'concept',mod:11,eb:'Documentación pensada para agentes',title:'Escribir *para que lo lea un agente*',table:{head:['Documento','Para qué','Cómo escribirlo','Error frecuente'],rows:[['AGENTS.md / CLAUDE.md','Contrato del repo','Secciones fijas; comandos copiables','Pegar el wiki'],['README','Qué es y cómo empezar','Primeros pasos ejecutables','Capturas sin texto'],['ADR','Por qué se decidió algo','Contexto, decisión, consecuencias','No guardar las alternativas'],['Runbook','Qué hacer ante un incidente','Pasos numerados, con comandos','Prosa larga sin pasos'],['CONTRIBUTING','Cómo proponer cambios','Reglas de PR y de pruebas','Contradecir el contrato']]},
n:{g:'Resumí las cuatro reglas de escritura: secciones fijas, comandos que se puedan copiar, ejemplos de lo bueno y lo malo, y frases cortas. Lo que ayuda a un agente también ayuda a una persona nueva.\n\nPedí que cada persona elija un documento de su repo que hoy no cumpliría y lo anote.',c:'Estos formatos sugeridos no son un estándar. La idea de fondo es que un agente no puede preguntar: el documento tiene que responder lo que preguntaría una persona nueva, con instrucciones ejecutables.'}});

P({type:'build',foot:'↓ ↑ avanzan los pasos · después: cómo pedírselo a tu asistente',mod:11,eb:'Construcción · guidelines con chequeo',title:'Una regla *y su chequeo* en CI',file:'repo-central/  →  ci/check-agents.sh  ·  .github/workflows  ·  CODEOWNERS',cw:'900px',steps:[
{t:'La guideline raíz',why:'Corta, con motivo y verificable. Esta fija qué modelos pueden usarse con código de la empresa.',code:'# AGENTS.md (organización)\n## Seguridad\n- Código de la empresa solo con modelos\n  de la lista aprobada (docs/modelos.md)\n- Ningún agente accede a credenciales de prod'},
{t:'El chequeo que la hace cumplir',why:'Un script que falla si el repo no tiene contrato o le falta una sección obligatoria.',code:'\n# ci/check-agents.sh\ntest -f AGENTS.md || { echo "Falta AGENTS.md"; exit 1; }\nfor s in Comandos Zonas; do\n  grep -q "^## $s" AGENTS.md || { echo "Falta ## $s"; exit 1; }\ndone'},
{t:'Se ejecuta en cada PR',why:'Automatizado en CI: nadie tiene que acordarse de revisarlo.',code:'\n# .github/workflows/contrato-agentes.yml\non: [pull_request]\njobs:\n  check:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: ./ci/check-agents.sh'},
{t:'Una skill compartida',why:'Lo que se repite entre equipos va al repo central como skill versionada.',code:'\n# skills/redactar-adr/SKILL.md\n---\nname: redactar-adr\ndescription: Redacta un ADR con el formato\n  de la organización.\n---'},
{t:'Dueños y revisión',why:'Cada guideline tiene responsables. Sin dueño, se desactualiza y se ignora.',code:'\n# CODEOWNERS\n/AGENTS.md  @org/plataforma\n/skills/    @org/plataforma\n/docs/modelos.md  @org/seguridad'}],
n:{g:'Mostrá los cinco bloques y relacioná cada uno con una idea de la jornada: la guideline (contrato), el chequeo (mecanismo determinista), el CI (automatización), la skill (U6) y los dueños (gobierno).\n\nAclaración: el ejemplo usa GitHub Actions y CODEOWNERS; en otra plataforma se usan equivalentes. Y el chequeo de ejemplo es mínimo: verifica la existencia de secciones, no su calidad.',c:'El workflow usa la acción oficial de checkout de GitHub. El script es un ejemplo mínimo; en la práctica se puede ampliar para validar formato, enlaces o la presencia de ciertas reglas. Una buena práctica es empezar con pocos chequeos y agregar más a medida que aparecen incumplimientos reales.'}});

P({type:'concept',mod:11,eb:'Gobernanza',title:'Cinco preguntas *que hay que responder*',table:{head:['Pregunta','Respuesta recomendada'],rows:[['¿Qué manda si hay conflicto?','Organización sobre equipo sobre repo, salvo excepción registrada'],['¿Quién la mantiene?','Un dueño nombrado por cada guideline'],['¿Cómo cambia?','Por PR al repo central, con revisión del dueño y versión'],['¿Cómo se pide una excepción?','Un registro con motivo, responsable y fecha de revisión'],['¿Cómo sabemos que se cumple?','Chequeo en CI y un indicador de cumplimiento por repo']]},
n:{g:'Recorré la tabla con un caso: «un equipo necesita usar un modelo que no está en la lista». ¿Quién decide, cómo se registra, cuándo se revisa? Si no saben responder, falta gobierno.\n\nAdvertencia de cuidado: demasiadas reglas generan evasión. Empezar con pocas, que se cumplan de verdad.',c:'Las preguntas son una plantilla de gobierno ligera. No reemplazan políticas formales de seguridad o cumplimiento de la organización, que deben alinearse con las guidelines de agentes.'}});

P({type:'activity',mod:11,eb:'Actividad 11 · La guideline que falta',title:'Escribí *una guideline* y su chequeo',scenario:'Cada equipo elige una guideline que hoy falta (modelos aprobados, formato de PR hechos por agentes, plantilla de ADR, zonas obligatorias) y la escribe con su chequeo. La propone como PR al repo central.',total:20,steps:[[2,'Elegí la guideline y apostá cuántos repos de tu equipo hoy ya la cumplen.'],[8,'Escribila: corta, con motivo y verificable.'],[6,'Escribí su chequeo (un script o una regla de CI) y probalo sobre un repo.'],[4,'Abrí el PR al repo central con dueño sugerido y motivo.']],gate:'El chequeo falla en un repo que no cumple y pasa en uno que sí.',kpi:'Repos que cumplen antes y después, falsos positivos del chequeo, largo de la guideline (cuanto más corta, mejor).',deliver:'Un PR al repo central con la guideline, su chequeo y un dueño propuesto.',trap:'Escribir una guideline sin chequeo: no se cumple. O con un chequeo tan estricto que todos lo ignoran.',mode:'Equipos de 4 · 20 min',
n:{g:'Cada equipo elige una guideline distinta para no repetir. El chequeo es lo difícil; ayudales a empezar por algo mínimo (existe el archivo, existe la sección).\n\nSi un equipo propone una guideline demasiado general («escribir buen código»), preguntá: «¿cómo se chequea?». Si no se puede, no es una guideline sino un deseo.',c:'El repo central puede ser real o simulado. Lo importante es la práctica de proponer un cambio por PR y que alguien más lo revise, que es el flujo con el que se mantienen las guidelines en el tiempo.',t:'En equipos con front y back, una guideline útil es la del contrato de API: define cómo se versionan y verifican los cambios para que ambos avancen sin pisarse.'}});

P({type:'quiz',mod:11,id:'q11',title:'Guidelines · *explicá el porqué*',qs:[
{q:'Una guideline sin chequeo automático, ¿qué es en la práctica?',o:['Una norma firme','Una sugerencia que se cumple mientras alguien se acuerde','Un mecanismo','Una excepción'],a:1,w:'Lo que no se verifica depende de la memoria. Por eso el chequeo es lo que la vuelve una regla.'},
{q:'Dos capas se contradicen: la de la organización y la de un repo. ¿Qué manda?',o:['El repo, que conoce mejor su caso','La organización, salvo una excepción registrada','La más reciente','La más larga'],a:1,w:'La capa superior manda; un desvío legítimo se registra como excepción con motivo y fecha de revisión.'},
{q:'¿Para qué sirve el dueño de una guideline?',o:['Para tener a quién culpar','Para mantenerla actualizada y decidir cambios','Para ahorrar tiempo','Para firmar los PRs'],a:1,w:'Sin dueño la guideline se desactualiza y se ignora; el dueño garantiza vigencia y criterio.'}],
n:{g:'Usá la segunda para repasar la precedencia por capas.',c:'Las preguntas cubren verificación, precedencia y responsabilidad.'}});

P({type:'broken',mod:11,id:'b11',title:'Las guidelines *que nadie cumple*',intro:'Una organización publicó sus «normas para agentes» hace un año. Nadie sabe si se respetan. ¿Qué está mal y por qué?',artifact:'wiki/normas-agentes (47 páginas)\n\nDueño: [[nadie]]\nÚltima edición: [[hace 14 meses]]\nChequeos: [[ninguno]]\nPáginas 12 y 31: [[se contradicen]]\nExcepciones: [[se piden por chat, sin registro]]\nFormato: [[prosa larga, sin comandos]]',cw:'760px',problems:[['Sin dueño ni actualización.','Una guideline vieja se ignora; sin responsable, nadie la corrige.'],['Sin chequeos.','No hay forma de saber si se cumple; depende de la memoria.'],['Contradicciones.','Dos reglas que chocan obligan a elegir y cada quien elige la que le conviene.'],['Excepciones informales.','Se pierde el motivo y la fecha de revisión; las excepciones se vuelven la regla.'],['Prosa larga, sin comandos.','Un agente (y una persona nueva) no puede ejecutarla ni consultarla con rapidez.']],
n:{g:'Ese wiki existe en muchas organizaciones. Preguntá cuántos tienen uno parecido. Después pedí que identifiquen qué es lo mínimo que cambiarían primero (suele ser: dueño y chequeo).',c:'Caso sintético inspirado en documentación de normas que quedó abandonada.'}});

P({type:'reflection',mod:11,id:'r11',title:'Las reglas *de tu organización*',prompts:['¿Qué regla de tu organización hoy no sabe cumplir un agente y por qué?','¿Quién debería ser el dueño de esa regla y cómo se enteraría de que se rompe?','¿Qué guideline escribirías primero y con qué chequeo?'],
n:{g:'Pedí un dueño con nombre y apellido. Una guideline sin dueño es el primer síntoma de abandono.',c:'La reflexión alimenta el plan de 30 días: la guideline y el chequeo elegidos son candidatos a primer compromiso.'}});

/* ---- Demo day ---- */
P({type:'concept',mod:91,eb:'Demo day · 45 minutos',title:'Mostrá *tu v1*',table:{head:['Criterio','Qué muestra el equipo','Peso'],rows:[['Puerta y examen','El v1 pasa su eval; hay línea base y tag','Alta'],['Evidencia de mejora','Hoja de experimento con regla previa y resultado','Alta'],['Diseño','Spec clara, herramientas mínimas, zonas y hook','Media'],['Guideline y chequeo','PR al repo central con su chequeo','Media'],['Claridad del porqué','Explican por qué decidieron cada cosa','Alta']]},
n:{g:'Explicá el formato: cada equipo tiene 5 minutos de demostración y 2 de preguntas. No se mira la presentación sino el resultado: corre el examen en vivo o muestra el registro. Dejá que el público pregunte «¿por qué?».\n\nRúbrica visible: la ven todos desde el principio. Evaluá con la misma vara a todos los equipos.',c:'El demo day tiene tres funciones: cierra el aprendizaje (explicar lo hecho consolida), da retroalimentación entre pares y crea un conjunto de ejemplos reales para la organización.'}});

P({type:'activity',mod:91,eb:'Demo day',title:'*Cinco minutos* por equipo',scenario:'Cada equipo muestra su agente v1: la tarea, la línea base, el cambio que lo mejoró, el resultado en vivo y la guideline propuesta. El resto del grupo pregunta «¿por qué?».',total:60,steps:[[5,'Preparación final: elegí qué mostrar y corré el examen una vez.'],[40,'Demostraciones: 5 minutos por equipo y 2 de preguntas.'],[10,'Votos y retroalimentación con la rúbrica.'],[5,'Cierre: lecciones compartidas para el repo central.']],gate:'El equipo corre su examen en vivo o muestra el registro con la etiqueta de línea base.',kpi:'Cumplimiento de la rúbrica, claridad del porqué, número de lecciones que otros equipos van a reutilizar.',deliver:'Las hojas de experimento y las guidelines propuestas, publicadas en el repo central.',trap:'Mostrar sólo el resultado sin explicar por qué se decidió así.',mode:'Todos · 60 min',
n:{g:'Llevá el tiempo con rigor: un cronómetro visible. Al finalizar cada demo, una pregunta del público y una tuya: «¿qué cambiarías si tuvieras otra hora?».\n\nCerrá con las lecciones más reutilizables, para el repo central.',c:'Si hay más equipos que tiempo, se hacen rondas en paralelo con subgrupos y cada uno elige un representante que muestre luego lo más útil.',t:'Nombrá un facilitador del público que anote las preguntas y las lecciones; al final se leen en voz alta.'}});

P({type:'reflection',mod:91,id:'r91',title:'Lo que *aprendiste* de los demás',prompts:['¿Qué decisión de otro equipo copiarías y por qué?','¿Qué te sorprendió de la forma en que otro equipo midió?','¿Qué lección tuya no estaba en la biblioteca y debería estarlo?'],
n:{g:'Cinco minutos de escritura. Después, compartí tres lecciones en voz alta. Es lo que enriquece al repo central.',c:'Aprender de los demás equipos es la segunda mitad del valor del demo day.'}});

var ARN=0;function fixArrows(el){$$('svg',el).forEach(function(sv){var mk={},defs=sv.querySelector('defs');if(!defs){defs=document.createElementNS('http://www.w3.org/2000/svg','defs');sv.insertBefore(defs,sv.firstChild)}
$$('[marker-end]',sv).forEach(function(p){var c=p.getAttribute('stroke')||'#8A8296';if(!mk[c]){var id='ax'+(++ARN);mk[c]=id;var m=document.createElementNS('http://www.w3.org/2000/svg','marker');m.setAttribute('id',id);m.setAttribute('viewBox','0 0 12 12');m.setAttribute('markerUnits','userSpaceOnUse');m.setAttribute('markerWidth','15');m.setAttribute('markerHeight','15');m.setAttribute('refX','9.6');m.setAttribute('refY','6');m.setAttribute('orient','auto-start-reverse');m.innerHTML='<path d="M3.2 2.2 L9.6 6 L3.2 9.8" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';defs.appendChild(m)}
p.setAttribute('marker-end','url(#'+mk[c]+')');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');p.setAttribute('fill','none');if(+p.getAttribute('stroke-width')>2.5)p.setAttribute('stroke-width','2.5')})})}
function render(){var s=SL[cur];var host=$('#stage');host.innerHTML=T[s.type](s);var el=host.firstChild;fixArrows(el);bindTimers(el);bindTA(el);bindSteps(el,s);if(s.type==='recipe'){bindRecipe(el,s)}if(s.type==='quiz'){drawQuiz(el,s)}if(s.type==='broken'){bindBroken(el)}if(s.type==='poll'){bindQR(el)}
