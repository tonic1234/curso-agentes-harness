<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curso Agentes con Harness</title>
<meta name="description" content="Curso-taller de dos días: entender, dirigir, construir, mejorar y gobernar agentes de código con harness.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap">
</head>
<body>

<style>
:root{--bg:#111014;--ink:#F0EDF4;--muted:#B9B3C3;--raised:#1D1B22;--raised2:#26232E;--line:rgba(105,97,111,.55);--purple:#AE62FF;--deep:#782AC2;--pink:#CB70B3;--soft:#C99BFF;--pinktxt:#E3A6D2;--dim:#8A8296;--ok:#7BD3A6;--bad:#FF8E9C;--lbg:#EEEDF0;--lcard:#FBFAFC;--lline:#D8D4DE;--link:#211A29;--lmuted:#625A6D;--ldeep:#5B1E99;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--soft)}
#app{display:flex;flex-direction:column;height:100%;min-width:0}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:#0B0A0E;min-width:0}
.brand{font:600 13px 'JetBrains Mono',monospace;letter-spacing:2px;color:var(--soft);white-space:nowrap}
.chip{font:600 12px 'JetBrains Mono',monospace;letter-spacing:1px;padding:5px 10px;border:1px solid var(--line);border-radius:20px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.mod{color:#fff;background:linear-gradient(90deg,var(--deep),var(--purple));border-color:transparent}
.spacer{flex:1}
.prog{height:3px;background:var(--raised);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--purple),var(--pink));width:0;transition:width .3s}
.work{flex:1;display:flex;min-height:0;min-width:0;position:relative}
.stagewrap{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.stagebox{position:relative;flex:none}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.drawer{width:0;flex:none;overflow:hidden;background:#0B0A0E;border-left:1px solid var(--line);transition:width .25s;display:flex;flex-direction:column;min-width:0}
.drawer.open{width:min(460px,42vw)}
.drawer .inner{width:min(460px,42vw);display:flex;flex-direction:column;height:100%;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:12px 8px;font:600 12px 'JetBrains Mono',monospace;letter-spacing:1px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--purple)}
.notebody{flex:1;overflow:auto;padding:16px 18px 28px;font-size:15px;line-height:1.6;color:var(--ink)}
.notebody h4{margin:18px 0 6px;font:600 12px 'JetBrains Mono',monospace;letter-spacing:2px;color:var(--soft);text-transform:uppercase}
.notebody h4:first-child{margin-top:0}
.notebody p{margin:0 0 10px}
.notebody ul{margin:0 0 10px;padding-left:20px}
.notebody li{margin-bottom:6px}
.notebody .time{display:inline-block;font:600 12px 'JetBrains Mono',monospace;color:#fff;background:var(--deep);padding:3px 9px;border-radius:12px;margin-bottom:12px}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:#0B0A0E;flex-wrap:wrap;min-width:0}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:600 13px 'Manrope',sans-serif;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--purple)}
.btn[aria-pressed=true]{background:linear-gradient(90deg,var(--deep),var(--purple));border-color:transparent;color:#fff}
.btn.pri{background:linear-gradient(90deg,var(--deep),var(--purple));border-color:transparent;color:#fff}
.btn:focus-visible,.tabs button:focus-visible,.opt:focus-visible,.x:focus-visible{outline:2px solid var(--pinktxt);outline-offset:2px}
.count{font:600 13px 'JetBrains Mono',monospace;color:var(--muted);min-width:70px;text-align:center}
.overlay{position:absolute;inset:0;background:rgb(11,10,14);z-index:20;display:none;flex-direction:column;min-width:0}
.overlay.open{display:flex}
.ovh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ovh h3{margin:0;font:600 20px 'Space Grotesk',sans-serif;flex:1}
.ovb{flex:1;overflow:auto;padding:18px;min-width:0}
.ovb input{width:100%;max-width:520px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:500 15px 'Manrope',sans-serif;margin-bottom:14px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gl div{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.gl b{display:block;font:600 16px 'Space Grotesk',sans-serif;color:var(--pinktxt);margin-bottom:4px}
.gl span{font-size:14px;line-height:1.5;color:var(--muted)}
.gl small{display:block;margin-top:6px;font:600 11px 'JetBrains Mono',monospace;color:var(--soft)}
.ag{max-width:760px}
.ag div{display:flex;gap:14px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:baseline;cursor:pointer}
.ag div:hover{background:var(--raised)}
.ag time{font:600 14px 'JetBrains Mono',monospace;color:var(--soft);width:96px;flex:none}
.ag .t{flex:1;font-size:16px}
.ag .m{font:600 12px 'JetBrains Mono',monospace;color:var(--muted)}
.ag .meal{background:rgba(203,112,179,.1)}
.ag .cur{background:rgba(174,98,255,.18)}

/* ---- slide internals (canvas 1920x1080) ---- */
.sl{position:absolute;inset:0;padding:96px 128px 104px;display:flex;flex-direction:column;gap:26px;justify-content:center;color:var(--ink);background:var(--bg)}
.sl.light{background:var(--lbg);color:var(--link)}
.sl .grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(240,237,244,.035) 0 1px,transparent 1px 96px);pointer-events:none}
.sl.light .grid{background:repeating-linear-gradient(90deg,rgba(33,26,41,.04) 0 1px,transparent 1px 96px)}
.sl .glow{position:absolute;inset:0;pointer-events:none}
.sl>*:not(.grid):not(.glow){position:relative}
.eb{font:600 24px 'JetBrains Mono',monospace;letter-spacing:3px;color:var(--soft);text-transform:uppercase}
.light .eb{color:var(--deep)}
.sl h1{margin:0;font:400 128px/1.02 'Space Grotesk',sans-serif;letter-spacing:-4px}
.sl h2{margin:0;font:400 68px/1.08 'Space Grotesk',sans-serif;letter-spacing:-1px}
.sl h3{margin:0;font:500 38px/1.15 'Space Grotesk',sans-serif}
.sl .lead{font-size:32px;line-height:1.4;color:var(--muted);max-width:1300px;margin:0}
.light .lead{color:var(--lmuted)}
.ac{color:var(--purple)}
.pk{color:var(--pinktxt)}
.light .ac{color:var(--deep)}
.light .pk{color:#9A3F84}
.cards{display:grid;gap:24px;flex:0 1 auto;min-height:0;align-content:start}
.cards.c2{grid-template-columns:1fr 1fr}.cards.c3{grid-template-columns:repeat(3,1fr)}.cards.c4{grid-template-columns:repeat(4,1fr)}
.cd{background:var(--raised);border:1px solid var(--line);border-radius:22px;padding:30px 32px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cd.hl{border-color:var(--purple);background:rgba(174,98,255,.09)}
.cd.pkc{border-color:var(--pink);background:rgba(203,112,179,.08)}
.cd.bad{border-color:var(--bad);background:rgba(255,142,156,.07)}
.cd.good{border-color:var(--ok);background:rgba(123,211,166,.07)}
.light .cd{background:var(--lcard);border-color:var(--lline)}
.cd .k{font:600 22px 'JetBrains Mono',monospace;letter-spacing:2px;color:var(--soft);text-transform:uppercase}
.cd.pkc .k{color:var(--pinktxt)}.cd.bad .k{color:var(--bad)}.cd.good .k{color:var(--ok)}
.light .cd .k{color:var(--deep)}
.cd p{margin:0;font-size:27px;line-height:1.42}
.cd p.m{color:var(--muted)}
.cd ul{margin:0;padding-left:28px;font-size:27px;line-height:1.45}
.cd li{margin-bottom:6px}
.big{font:500 120px/1 'Space Grotesk',sans-serif;color:var(--purple)}
.foot{position:absolute!important;left:128px;right:128px;bottom:34px;display:flex;gap:16px;font:600 22px 'JetBrains Mono',monospace;color:var(--dim)}
.foot .sp{flex:1}
.src{font-size:22px;color:var(--dim);margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:26px}
.tbl th{font:600 22px 'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;text-align:left;padding:14px 18px;background:var(--raised2);color:var(--soft)}
.tbl td{padding:14px 18px;border-top:1px solid var(--line);vertical-align:top;line-height:1.35}
.light .tbl th{background:#E2D6F3;color:var(--ldeep)}.light .tbl td{border-top-color:var(--lline)}
.gli{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;flex:1;align-content:start}
.gli div{background:var(--lcard);border:1px solid var(--lline);border-radius:18px;padding:18px 24px}
.gli b{display:block;font:600 30px 'Space Grotesk',sans-serif;color:var(--ldeep);margin-bottom:6px}
.gli span{font-size:25px;line-height:1.38;color:var(--link)}
.gli em{display:block;font-style:normal;font:500 22px 'JetBrains Mono',monospace;color:var(--lmuted);margin-top:6px}
.step{display:flex;gap:22px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line)}
.step .mn{width:110px;font:600 26px 'JetBrains Mono',monospace;color:var(--pinktxt);flex:none}
.step p{margin:0;font-size:28px;line-height:1.35}
.timer{display:inline-flex;align-items:center;gap:14px}
.timer .tv{font:500 56px 'JetBrains Mono',monospace;color:#fff;background:linear-gradient(135deg,#5B1E99,#8E45E0);padding:6px 24px;border-radius:16px;min-width:210px;text-align:center}
.x{font:600 24px 'Manrope',sans-serif;border-radius:14px;padding:12px 26px;border:1px solid var(--line);background:var(--raised);color:var(--ink)}
.x.pri{background:linear-gradient(90deg,var(--deep),var(--purple));border-color:transparent;color:#fff}
.light .x{background:var(--lcard);border-color:var(--lline);color:var(--link)}
.qq{display:flex;flex-direction:column;gap:12px}
.qq .qt{font:500 32px/1.25 'Space Grotesk',sans-serif;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{text-align:left;font:500 25px/1.3 'Manrope',sans-serif;padding:14px 20px;border-radius:14px;border:1px solid var(--lline);background:var(--lcard);color:var(--link)}
.opt:hover:not([disabled]){border-color:var(--deep)}
.opt.right{border-color:#2E9E6B;background:#DDF3E8}
.opt.wrong{border-color:#C23A52;background:#FBE4E8}
.why{font-size:24px;line-height:1.4;color:var(--lmuted);margin:0;display:none}
.why.show{display:block}
.code{background:#0B0A0E;border:1px solid var(--line);border-radius:18px;padding:26px 30px;font:500 25px/1.5 'JetBrains Mono',monospace;color:#D9D3E3;white-space:pre-wrap;margin:0;overflow:hidden}
.code .hit{background:rgba(255,142,156,.18);border-bottom:2px solid var(--bad)}
.prob{display:none;gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
.prob.show{display:flex}
.prob b{font:600 24px 'JetBrains Mono',monospace;color:var(--bad);width:44px;flex:none}
.prob p{margin:0;font-size:26px;line-height:1.35}
.prob p i{font-style:normal;color:var(--muted)}
.ta{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px 18px;color:var(--ink);font:500 26px/1.4 'Manrope',sans-serif;resize:none;height:130px}
.ref a{display:block;font-size:26px;line-height:1.35;padding:10px 0;border-top:1px solid var(--line)}
.ref small{color:var(--dim);font-size:22px;display:block}
svg text{font-family:'Manrope',sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.in>.cd,.in .step,.in .gli div{animation:rise .5s both}
.in>.cd:nth-child(2){animation-delay:.08s}.in>.cd:nth-child(3){animation-delay:.16s}.in>.cd:nth-child(4){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){.in>.cd,.in .step,.in .gli div{animation:none}}
@media (max-width:900px){
 .drawer{position:absolute;right:0;bottom:0;left:0;top:auto;height:0;width:100%!important;border-left:0;border-top:1px solid var(--line);transition:height .25s;z-index:10}
 .drawer.open{height:58%;width:100%!important}
 .drawer .inner{width:100%}
 .brand{display:none}
 .ctrl{gap:6px;padding:8px 10px}.btn{padding:7px 10px;font-size:12px}
}
.sl.act,.sl.brk{padding-top:64px;gap:16px}
.act .step{padding:10px 0}.act .step p{font-size:25px}.act .cd{padding:16px 24px;gap:6px}.act .cd p{font-size:23px}.act .lead{font-size:27px!important}.act h2,.brk h2{font-size:60px}
.brk .code{font-size:22px;padding:20px 26px}.brk .prob{padding:10px 0}.brk .prob p{font-size:24px}.brk .lead{font-size:27px!important}
.dgc .cd{padding:16px 24px;gap:6px}.dgc .cd p{font-size:23px}
.plc .cd{padding:16px 24px}
.bstep{border-top:1px solid var(--line);padding:12px 0;opacity:.4;transition:opacity .3s}.bstep.on{opacity:1}.bstep.done{opacity:.8}
.bstep .bh{display:flex;gap:16px;align-items:baseline}.bstep .bh b{font:600 24px 'JetBrains Mono',monospace;color:var(--pinktxt);width:36px}
.bstep h3{font-size:30px}.bstep .why{display:none;margin:8px 0 0 52px;font-size:25px;line-height:1.4;color:var(--muted)}.bstep.on .why{display:block}
.sctl{display:flex;gap:12px;margin-top:14px;align-items:center;flex-wrap:wrap}
.cfile{font:600 22px 'JetBrains Mono',monospace;color:var(--soft);margin-bottom:8px}
.cl{min-height:1.5em}.cl.nw{background:rgba(174,98,255,.16);border-left:3px solid var(--purple);margin-left:-14px;padding-left:11px;animation:rise .4s both}
.acap h3{font-size:46px;margin:6px 0 10px}.acap p{font-size:27px;line-height:1.42;color:var(--muted);margin:0 0 16px}
.st{opacity:.1;transition:opacity .5s}.st.on{opacity:1}
.flow{stroke-dasharray:12 10;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-44}}
@keyframes pulse{0%,100%{stroke-width:2}50%{stroke-width:7}}
.st.cur .pulse{animation:pulse 1.3s ease-in-out infinite}
.cmp{font:600 22px 'JetBrains Mono',monospace;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase}.cmp.bad{color:var(--bad)}.cmp.good{color:var(--ok)}
.dayt{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.dayt button{background:none;border:0;padding:5px 12px;font:600 12px 'JetBrains Mono',monospace;color:var(--muted)}
.dayt button[aria-pressed=true]{background:linear-gradient(90deg,var(--deep),var(--purple));color:#fff}
@media (prefers-reduced-motion:reduce){.flow,.st.cur .pulse{animation:none}.st{transition:none}}
.sl.act .code,.sl.brk .code{font-size:23px}
.sl.act [data-codeb]{max-height:660px;overflow:auto}

.rtabs{display:flex;gap:10px;align-items:center;margin-top:2px}
.rtabs .sp{flex:1}
.rt{background:var(--raised);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:12px 22px;font:600 22px 'Manrope',sans-serif;cursor:pointer}
.rt.on{background:linear-gradient(135deg,var(--deep),var(--purple));color:#fff;border-color:transparent}
.rmsg{font:600 20px 'JetBrains Mono',monospace;color:var(--pinktxt)}
.rcpb{background:#0B0A0E;border:1px solid var(--line);border-radius:16px;padding:20px 28px;max-height:650px;overflow:auto;min-height:0}
.rcpb[hidden]{display:none}
.rp{font:500 23px/1.45 'Manrope',sans-serif;white-space:pre-wrap;color:var(--ink)}
.rf pre{margin:0 0 6px;font:500 20px/1.45 'JetBrains Mono',monospace;white-space:pre;color:var(--ink);overflow:visible}
.rfn{font:700 19px 'JetBrains Mono',monospace;color:var(--soft);letter-spacing:1px;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.rfn:first-child{margin-top:0;padding-top:0;border-top:0}
.rk ol{margin:0;padding-left:34px;display:flex;flex-direction:column;gap:14px;font-size:26px;line-height:1.4}
.rk li::marker{color:var(--soft);font-weight:700}
.rnote{margin:22px 0 0;padding:16px 20px;border-left:4px solid var(--pink);background:var(--raised);border-radius:8px;font-size:23px;color:var(--muted)}
.sl.rcps{justify-content:center;gap:14px}

</style>

 <div class="bar"><span class="brand">SOMA · AXONICA GROUP</span><span class="chip mod" id="modchip"></span><span class="chip" id="slchip"></span><span style="flex:1"></span><span class="dayt" role="group" aria-label="Día del curso"><button id="bd1" aria-pressed="true">DÍA 1</button><button id="bd2" aria-pressed="false">DÍA 2</button></span></div>

R["0.cover#1"]=function(){return {type:'cover',mod:0,eb:'Taller de un día · ingeniería con agentes',title:'Harness *Engineering*',sub:'El modelo es el mismo para todos. Lo que cambia el resultado es el sistema que lo rodea: contexto, herramientas, verificación y medición.',chips:['8 h 15 min','7 unidades','Hands-on con tu propio repo','Para equipos front y back'],credit:'Soma · Axonica Group',
n:{g:'Bienvenida. Antes de empezar, dos avisos de uso: el botón «Notas» de abajo (o la tecla N) abre el guion del orador y el contexto de cada diapositiva; la tecla G abre el glosario; la tecla A, la agenda.\n\nFrase de apertura sugerida: «Todos acá ya usan Claude Code o Codex. Hoy no vamos a aprender a usarlos; vamos a aprender a construir lo que los rodea, porque ahí está la diferencia entre un agente que sorprende y uno que se puede dejar trabajando».\n\nPresentá el día en una línea: siete unidades, cada una termina con cuestionario, un caso roto donde el grupo tiene que decir qué está mal y por qué, y una reflexión escrita.',c:'«Harness» se usa acá con el sentido corriente en la comunidad: todo lo que rodea al modelo para que haga trabajo útil (instrucciones, herramientas, memoria, validaciones). No es un producto ni una librería. Si alguien pregunta por la definición formal, remitir al artículo de Anthropic sobre harnesses para agentes de larga duración.',s:[['Anthropic · Effective harnesses for long-running agents','https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents']]}};};
R["0.agenda#1"]=function(){return {type:'agenda',mod:0,eb:'Agenda',title:'Un día, *con pausas reales*',foot:'Toca una fila en el panel de agenda (tecla A) para saltar',
n:{g:'Recorré la agenda de arriba abajo, sin leerla entera. Marcá tres cosas: los bloques de comida son fijos y no se recortan (desayuno 20, almuerzo 30, merienda 30); ningún tramo sin pausa dura más de 55 minutos; y la tarde es la parte más práctica.\n\nAviso de honestidad: la pausa corta de 10 minutos a las 10:35 es un agregado nuestro al pedido original de comidas. Está porque el primer bloque de la mañana (apertura + U2) llega a 75 minutos continuos. Si el grupo viene muy suelto, se puede acortar a 5.',c:'Criterio de diseño tomado de la revisión de cursos similares: un bloque de enseñanza no debería pasar de unos 55–60 minutos sin pausa; aproximadamente un tercio de cada hora es explicación y el resto es práctica; los temas avanzados (observabilidad, auto-mejora) entran como demostración breve y no como laboratorio completo.',t:'Si vas corto de tiempo, el orden de sacrificio es: primero la reflexión escrita de cada unidad (se puede dejar como tarea), después el segundo quiz-pregunta de U4, y por último nunca el caso roto, que es lo que más se recuerda.'}};};
R["0.concept#1"]=function(){return {type:'concept',mod:0,eb:'Objetivos del día',title:'Qué *cambia en tu trabajo* el lunes',cards:[
{k:'Productividad',h:'Menos idas y vueltas',p:'Un contrato de repo (CLAUDE.md / AGENTS.md) que el agente de verdad lee y cumple.',c:'hl'},
{k:'Claridad',h:'Saber si está bien',p:'Pruebas, puertas y métricas que dicen «listo» sin depender de tu intuición.'},
{k:'Seguridad',h:'Delegar sin miedo',p:'Permisos, hooks y zonas para que un agente trabaje solo dentro de límites.'},
{k:'Escala',h:'Más de un agente a la vez',p:'Worktrees, enjambres y una fábrica de features medida por resultados.',c:'pkc'}],
n:{g:'Leé las cuatro tarjetas y pedí a cada persona que elija en voz alta cuál le duele más hoy. Anotá las respuestas: son la brújula para dónde profundizar.\n\nEl hilo del día es una sola idea: productividad y claridad. Cada unidad se justifica por una de esas dos cosas. Si algo no mueve ninguna, no entra.',c:'Para ubicar la ambición del taller: el objetivo no es que el equipo escriba mejores prompts. Es que cambie el sistema de trabajo (repo, pruebas, permisos, tableros) de manera que los resultados mejoren aunque cambie el modelo o quien lo use.'}};};
R["0.poll#1"]=function(){return {type:'poll',mod:0,eb:'Termómetro del grupo',title:'Dónde estamos *hoy*',cards:[{k:'Dos minutos, desde el celular',p:'Respondé el termómetro: qué usás, cuánto confiás y qué te frena. Los resultados orientan el resto del día.',c:'hl'},{k:'Privacidad',p:'No pedimos datos personales. Se ve el agregado del grupo.',c:''}],url:'https://claude.ai/artifact/M2mUS3hWtv6v7WPYq3wHZR#votar',
n:{g:'Mostrá el QR y dá dos minutos. Mientras votan, repartí el piso de confianza: preguntá a mano alzada «¿quién mergearía hoy un PR de agente sin leerlo?». Casi nadie levanta la mano; después preguntá «¿y quién lo mergeó igual alguna vez?». Ahí está la brecha que cerramos hoy.\n\nAl final del día volvemos a este termómetro para ver el cambio.',c:'El termómetro es un artefacto aparte. Si el enlace no abre para alguien, puede ser un tema de permisos de compartición: confirmar antes del taller que la encuesta esté compartida con la organización.',t:'Plan B sin celulares: votación a mano alzada con tres preguntas (frecuencia de uso, nivel de confianza, mayor freno). Anotá los conteos en la pizarra.'}};};
R["0.glossary#1"]=function(){return {type:'glossary',mod:0,eb:'Glosario · antes de empezar',title:'Ocho términos *para hablar el mismo idioma*',terms:[
['Agente','Un modelo que decide qué herramienta usar, la ejecuta, mira el resultado y repite hasta terminar.','Claude Code, Codex'],
['Harness','Todo lo que rodea al modelo: instrucciones, herramientas, memoria y validaciones.','«el arnés»'],
['Contexto','Lo que el modelo tiene delante en un momento dado. Es finito y se paga por token.',''],
['Token','Unidad de texto que procesa el modelo; mide costo y límite de contexto.',''],
['Herramienta','Capacidad que el agente puede invocar: leer archivos, ejecutar comandos, llamar a una API.','tool'],
['Puerta (gate)','Condición binaria que debe cumplirse para aceptar un resultado; por ejemplo, que las pruebas pasen.',''],
['KPI','Indicador medible que se calcula con un script, no con una opinión.',''],
['Revisor','Otro agente o persona cuya tarea es encontrar fallas, no producir la solución.','']],
n:{g:'No leas el glosario palabra por palabra. Pedí que lo hojeen 60 segundos y preguntá cuál de los ocho términos usarían distinto en su equipo. Casi siempre aparece «agente» o «gate» con significados distintos. Esa discrepancia es la razón de ser de esta lámina.\n\nRecordá que el glosario completo, con todas las unidades, está siempre disponible en la tecla G y se puede buscar.',c:'Los glosarios van antes de cada unidad a propósito: es más barato aclarar un término antes de usarlo que explicarlo en medio de un ejercicio. El panel de glosario agrega los de todas las unidades en una sola lista ordenada.'}};};
R["0.concept#2"]=function(){return {type:'concept',mod:0,eb:'Método',title:'Cómo funciona *cada unidad*',table:{head:['Paso','Qué pasa','Tiempo'],rows:[['1 · Glosario','Alineamos los términos que vamos a usar','2–3 min'],['2 · Explicación','Dos o tres ideas con un caso real detrás','15–20 min'],['3 · Actividad','Práctica en parejas sobre un repo de ejemplo, con puerta y KPI','15–20 min'],['4 · Cuestionario','Tres preguntas; importa el porqué, no el acierto','5 min'],['5 · Caso roto','Se muestra algo mal hecho: ¿qué está mal y por qué?','5 min'],['6 · Reflexión','Escritura individual y luego en parejas','3 min']]},
n:{g:'Explicá la lógica de los seis pasos y por qué el caso roto va después del cuestionario: el cuestionario mide si recuerdan; el caso roto mide si pueden aplicar el concepto a algo concreto que nunca vieron.\n\nReglas de las actividades: se apuesta tiempo antes de empezar (calibración); hay una puerta de pruebas ocultas; después se puntúa con KPIs que calcula un script; cada ronda produce un entregable para el repo real de cada uno. Tocar pruebas existentes cuesta −5.',c:'La «Liga del Harness» es la mecánica de juego que ordena las actividades. Pensar los ejercicios como una liga con puerta + KPI evita el sesgo habitual de «a mí me parece que quedó bien»: o pasa la puerta o no, y los KPI salen de un script.',q:[['¿Por qué la puerta va antes que los KPI?','Porque un resultado que no pasa las pruebas no debería ni medirse; medirlo sólo premia velocidad sobre corrección.']]}};};
R["0.concept#3"]=function(){return {type:'concept',mod:0,eb:'Idea central',title:'El modelo es *una parte del sistema*',diagram:'harness',dw:'900px',cards:[
{k:'Lo que no controlás',p:'Los pesos del modelo. Cambian con cada versión y no se negocian.'},
{k:'Lo que sí controlás',p:'Qué ve, qué puede tocar, cómo se verifica y qué se recuerda entre sesiones.',c:'hl'},
{k:'Consecuencia',p:'Mejorar el harness rinde más y dura más que mejorar el prompt de hoy.',c:'pkc'}],
n:{g:'Mostrá el diagrama y recorrelo: el modelo en el centro, y alrededor cuatro cosas que son tuyas: contexto, herramientas, memoria y validación.\n\nIdea para remarcar: la mayoría de las frustraciones con agentes («lo hace casi bien») no son del modelo sino del entorno donde lo ponemos a trabajar. En la encuesta de Stack Overflow de 2025, el 66 % de los desarrolladores señaló la frustración de soluciones de IA que están «casi bien, pero no del todo». Eso es un problema de verificación y contexto, no de inteligencia.',c:'Dato de la encuesta de desarrolladores de Stack Overflow 2025: 66 % señala el problema de soluciones «casi correctas pero no del todo», y alrededor del 45 % dice que depurar código generado por IA lleva más tiempo. Son autoinformes de una encuesta, no una medición de productividad; usarlos como señal de la frustración, no como prueba de causa.',s:[['Stack Overflow Developer Survey 2025 · IA','https://survey.stackoverflow.co/2025/ai'],['Anthropic · Effective harnesses','https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents']]}};};
R["1.opener#1"]=function(){return {type:'opener',mod:1,time:'09:40',dur:55,title:'Contexto y *memoria*',lead:'Un agente rinde según lo que sabe del proyecto al empezar. Hoy escribís el contrato que lo ordena.',goals:['Decidir qué entra en CLAUDE.md o AGENTS.md y qué no','Separar instrucciones, progreso y decisiones','Medir con un script cuánto mejora el agente con tu contrato'],take:'Un CLAUDE.md / AGENTS.md de menos de 40 líneas para tu repo real.',
n:{g:'Abrí con la pregunta: «¿Cuántas veces le explicaron hoy a un agente cómo correr los tests de su proyecto?». El contexto es el recurso más caro y más desaprovechado del trabajo con agentes.\n\nPromesa de la unidad: salir con un contrato corto, probado contra un repo de ejemplo, listo para copiar al repo de verdad.',c:'Claude Code lee CLAUDE.md al iniciar la sesión; Codex y otros agentes leen AGENTS.md. Ambos son archivos de texto en el repo que se cargan en el contexto. Por eso importa que sean cortos: ocupan lugar en cada sesión.',s:[['Claude Code · Memoria','https://docs.claude.com/en/docs/claude-code/memory']]}};};
R["1.glossary#1"]=function(){return {type:'glossary',mod:1,eb:'Glosario · unidad 2',title:'Seis términos *de contexto*',terms:[
['CLAUDE.md / AGENTS.md','Archivo del repo que el agente carga al empezar: comandos, convenciones y límites.','contrato'],
['Ventana de contexto','Cantidad máxima de tokens que el modelo puede tener presentes a la vez.',''],
['Compactación','Resumen automático de la conversación cuando el contexto se llena; puede perder detalles.',''],
['Memoria persistente','Información que sobrevive entre sesiones porque vive en archivos, no en la conversación.',''],
['Skill','Carpeta con instrucciones y recursos que el agente carga sólo cuando la tarea lo pide.','SKILL.md'],
['ADR','Registro breve de una decisión de arquitectura: qué se decidió y por qué.','Architecture Decision Record']],
n:{g:'Pedí que alguien explique con sus palabras la diferencia entre «contexto» y «memoria». La respuesta correcta es que el contexto es lo que el modelo tiene delante ahora y la memoria es lo que dejamos escrito para que vuelva a tenerlo mañana.',c:'Una skill es útil porque no ocupa contexto hasta que se necesita: el agente ve el nombre y la descripción y carga el resto bajo demanda. Eso la diferencia de un CLAUDE.md, que se carga siempre.'}};};
R["1.concept#1"]=function(){return {type:'concept',mod:1,eb:'Qué escribir',title:'El contrato: *lo que el agente no puede deducir*',table:{head:['Va en el contrato','No va','Por qué'],rows:[['Cómo correr tests, lint y build (comandos exactos)','Explicaciones de qué es el framework','Sin el comando, adivina y pierde tiempo'],['Convenciones que rompen el CI si se ignoran','«Escribí código limpio»','No es verificable'],['Zonas prohibidas y por qué','El wiki completo pegado','Ocupa contexto en cada sesión'],['Dónde viven las decisiones (ADR) y el progreso','Reglas absolutas sin mecanismo','Una orden no es un freno: usá hooks']]},
n:{g:'Explicá el criterio de una línea: «si el agente se equivoca sin esta línea y no puede deducirla leyendo el código, entra; si no, sobra». Recorré la tabla fila por fila con un ejemplo de tu propio repo.\n\nPunto fino: el contrato no hace cumplir nada. Es una recomendación que el modelo suele seguir, pero no una garantía. Lo que no puede romperse tiene que vivir en un mecanismo que bloquee (permisos, hooks), tema de la unidad 4.',c:'Referencia práctica: mantener el contrato corto (decenas de líneas, no cientos) y revisarlo como código. Una línea que nadie recuerda por qué está ahí es candidata a borrarse. Si el equipo usa varios agentes, es común mantener un único AGENTS.md y que CLAUDE.md lo importe o lo referencie.',t:'Ejercicio relámpago de 2 minutos: cada persona tacha mentalmente tres líneas de su CLAUDE.md actual que no pasan el criterio.',q:[['¿Y si el repo es enorme?','Un contrato raíz corto y contratos por carpeta o skills para lo específico; así cada tarea carga sólo lo que necesita.']]}};};
R["1.concept#2"]=function(){return {type:'concept',mod:1,eb:'Memoria entre sesiones',title:'Tres cosas *distintas* que recordar',cards:[
{k:'Instrucciones',h:'Cómo trabajar acá',p:'Comandos, convenciones, límites. Cambian poco. Viven en CLAUDE.md / AGENTS.md.',c:'hl'},
{k:'Progreso',h:'Dónde quedamos',p:'Qué está hecho, qué falta, qué falló. Cambia en cada sesión. Vive en un archivo de progreso y en git.'},
{k:'Decisiones',h:'Por qué es así',p:'Alternativas descartadas y motivos. Evita que el agente «mejore» algo que ya se discutió. Vive en ADR.',c:'pkc'}],
note:'Patrón de Anthropic para agentes de larga duración: un agente inicializador crea init.sh, un archivo de progreso y una lista de funcionalidades en JSON con un campo passes; el agente de trabajo avanza una por vez y no edita las pruebas.',
n:{g:'Pregunta disparadora: «¿Dónde guarda hoy tu equipo el por qué de las decisiones?». Casi siempre en la cabeza de alguien. El agente no puede leer cabezas.\n\nContá el patrón de Anthropic: para tareas que duran más que una sesión, primero se prepara el terreno (script de arranque, archivo de progreso, lista de funcionalidades con estado pasa/no pasa) y después cada sesión retoma desde esos archivos. Lo importante es la disciplina: una funcionalidad por sesión, estado explícito, y las pruebas no se tocan para que «pasen».',c:'Del artículo de Anthropic: el agente inicializador prepara init.sh, un archivo de progreso y una lista de características en JSON; cada ítem tiene un campo passes que sólo se marca verdadero después de verificar con pruebas de extremo a extremo (con automatización de navegador). La instrucción de no editar las pruebas busca evitar que el agente declare victoria cambiando el examen.',s:[['Anthropic · Effective harnesses for long-running agents','https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents']]}};};
R["1.activity#1"]=function(){return {type:'activity',mod:1,eb:'Actividad 1 · El contrato',title:'Mismo agente, *con y sin contrato*',scenario:'Repo «turnos» (agenda de turnos). Tarea: agregar «reprogramar turno» respetando las reglas del proyecto. Pareja por computadora: una persona opera, la otra mide.',total:20,steps:[[3,'Apostá: ¿cuántos minutos y cuántas correcciones necesita el agente sin contrato? ¿Y con?'],[5,'Ronda A: corré la tarea sin contrato. Anotá correcciones, minutos y si pasó la puerta.'],[7,'Escribí el contrato (máx. 40 líneas): comandos, convenciones, zonas prohibidas, dónde van las decisiones.'],[5,'Ronda B: repetí la tarea con el contrato. Compará.']],gate:'Las pruebas ocultas pasan. Si no pasan, la ronda vale 0 aunque haya sido rápida.',kpi:'Correcciones manuales pedidas, minutos reales vs apostados, tokens usados, pruebas existentes tocadas (−5 cada una).',deliver:'Tu CLAUDE.md / AGENTS.md listo para el repo real.',trap:'Pegar el wiki entero «por las dudas». Más contexto no es mejor contexto.',mode:'Parejas · 20 min',
n:{g:'Consigna: dos rondas con la misma tarea. La variable es el contrato. El script de puntaje cuenta correcciones, minutos y pruebas tocadas; ustedes sólo anotan lo que el script no ve.\n\nAntes de empezar, hacé que cada pareja escriba su apuesta de tiempo en voz alta: esa calibración (¿qué tan bien nos conocemos?) es parte del aprendizaje.\n\nRecorré las mesas con una pregunta: «¿Esa línea la puede deducir el agente leyendo el código?». Si sí, sobra.',c:'Cómo medir sin instrumentación pesada: con un script que corre las pruebas ocultas, cuenta archivos de prueba modificados en el diff (git diff --name-only) y registra el tiempo de reloj entre inicio y fin. No hace falta nada más sofisticado para este ejercicio.',t:'Si el repo de ejemplo no está disponible, cualquier proyecto chico con tests sirve; lo importante es que la tarea sea la misma en ambas rondas y que exista una puerta automática.'}};};
R["1.quiz#1"]=function(){return {type:'quiz',mod:1,id:'q1',title:'Contexto y memoria · *explicá el porqué*',qs:[
{q:'¿Qué criterio decide si una línea entra en el CLAUDE.md?',o:['Que sea importante para la empresa','Que el agente se equivoque sin ella y no pueda deducirla del código','Que sea larga y detallada','Que no esté en el wiki'],a:1,w:'El contrato es contexto que se paga en cada sesión. Sólo vale lo que evita errores que el agente no puede evitar leyendo el repo.'},
{q:'Una regla que nunca puede romperse (no tocar /migrations). ¿Dónde se pone?',o:['En mayúsculas en el CLAUDE.md','En un permiso de denegación o un hook que la bloquee','En cada prompt, por las dudas','En un comentario dentro de la carpeta'],a:1,w:'Las instrucciones son probabilísticas: el modelo suele seguirlas, no siempre. Lo que debe ser siempre verdad necesita un mecanismo determinista.'},
{q:'Tras horas de trabajo, el agente olvida una decisión. ¿Qué corrige el problema de raíz?',o:['Pedirle que se acuerde más','Registrar decisiones y progreso en archivos versionados que se lean al empezar','Cambiar de modelo','Aumentar la temperatura'],a:1,w:'La memoria entre sesiones es un problema de ingeniería, no de voluntad: si no está escrito en un archivo, no existe en la sesión siguiente.'}],
n:{g:'Modalidad: cada persona responde en su pantalla; después elegí una pregunta y pedí que alguien defienda una opción incorrecta. Defender lo incorrecto muestra por qué atrae.\n\nNo cierres con «la correcta es la b»: cerrá con «¿qué diferencia hay entre una instrucción y un mecanismo?».',c:'Las tres preguntas apuntan a las tres ideas de la unidad: criterio de relevancia, límites de las instrucciones y memoria externa.'}};};
R["1.broken#1"]=function(){return {type:'broken',mod:1,id:'b1',title:'El CLAUDE.md *que empeoró todo*',intro:'Un equipo lo escribió «para que el agente sea mejor». Desde entonces, tarda más y se equivoca más. ¿Qué está mal y por qué?',artifact:'# CLAUDE.md\n\nSos un desarrollador senior experto.\n[[Escribí código limpio y de calidad.]]\nUsá las mejores prácticas.\n\n[[<<< aquí pegamos las 1.200 líneas >>>]]\n[[<<< del wiki de arquitectura >>>]]\n\nLos tests están en alguna parte.\n[[NUNCA modifiques la carpeta /migrations.]]\nAvisame cuando termines.',cw:'820px',problems:[['Instrucciones que no se pueden verificar.','«Código limpio» no dice qué hacer ni cómo saber si se cumplió.'],['Wiki pegado entero.','Ocupa contexto en cada sesión y diluye lo importante; mejor un enlace o una skill.'],['No dice cómo correr los tests.','Sin comando exacto el agente adivina; es la línea más valiosa y falta.'],['Regla absoluta sin mecanismo.','Una orden en un texto no impide el error; hace falta un permiso o un hook que bloquee /migrations.']],
n:{g:'Dejá 2 minutos para que piensen en parejas. Revelá un problema por vez y pedí que alguien explique por qué es un problema antes de mostrar el texto.\n\nCierre: «Este archivo parece cuidadoso, y eso es lo peligroso: la longitud se confunde con rigor».',c:'Caso inspirado en patrones frecuentes, no en una empresa concreta.'}};};
R["1.reflection#1"]=function(){return {type:'reflection',mod:1,id:'r1',title:'Tu *contrato*, hoy',prompts:['¿Qué tres líneas de tu CLAUDE.md o AGENTS.md actual borrarías después de esta unidad y por qué?','¿Qué decisión de tu equipo hoy sólo vive en la cabeza de una persona? ¿Dónde la escribirías?','¿Qué regla «innegociable» estás confiando a una instrucción en lugar de a un mecanismo?'],
n:{g:'Tres minutos en silencio, escribiendo. Después, dos minutos en parejas compartiendo una sola respuesta. No hace falta compartir todo.\n\nQuedan guardadas sólo en este navegador; si quieren conservarlas, que las copien.',c:'La reflexión escrita antes de hablar mejora la calidad de la conversación posterior y evita que hablen siempre los mismos.'}};};
R["2.opener#1"]=function(){return {type:'opener',mod:2,time:'10:45',dur:55,title:'Verificación y *calidad*',lead:'Un agente que dice «listo» sin pruebas es una opinión. Hoy convertimos «listo» en un hecho.',goals:['Escribir primero la prueba que falla y aprobarla vos','Reconocer cuándo un agente hace trampa para pasar las pruebas','Medir la calidad de las pruebas, no sólo la cobertura'],take:'Una plantilla «bug → prueba roja → arreglo» para tu repo.',
n:{g:'Pregunta de apertura: «¿Cuántos mergearon alguna vez un cambio de agente sólo porque los tests pasaban?». Después: «¿Y cuántos miraron los tests?».\n\nLa unidad tiene una tesis: verificar es el trabajo humano más valioso cuando programa el agente.',c:'Esta es la ventaja competitiva de quien trabaja bien con agentes: el costo de producir código cae, y el cuello de botella pasa a ser saber si es correcto.'}};};
R["2.glossary#1"]=function(){return {type:'glossary',mod:2,eb:'Glosario · unidad 3',title:'Seis términos *de verificación*',terms:[
['TDD','Escribir la prueba que falla (rojo), hacerla pasar (verde) y mejorar (refactor).','red · green · refactor'],
['Reward hacking','El agente cumple la métrica sin cumplir el objetivo: por ejemplo, hace pasar el test sin arreglar el bug.',''],
['Prueba oculta','Prueba que el agente no ve mientras trabaja; mide si generalizó o sólo memorizó.','hidden test'],
['Mutation testing','Se rompe el código a propósito (mutantes); una buena suite debería detectarlo.','mutantes'],
['Regresión','Algo que funcionaba y dejó de funcionar tras un cambio.',''],
['Test inestable','Prueba que a veces pasa y a veces falla sin que el código cambie.','flaky']],
n:{g:'Hacé hincapié en «reward hacking»: es el término que más va a aparecer en el resto del día. Definición simple: «cuando le das una nota y el agente optimiza la nota, no el aprendizaje».',c:'El término viene de aprendizaje por refuerzo. En ingeniería con agentes designa la conducta de aprobar la medida (tests, linter, cobertura) por un camino que no cumple la intención.'}};};
R["2.concept#1"]=function(){return {type:'concept',mod:2,eb:'Rojo antes que verde',title:'Primero la prueba, *aprobada por vos*',cards:[
{k:'1 · Rojo',h:'La prueba falla por el motivo correcto',p:'El agente la escribe y vos la leés. Si la prueba no describe el bug, el resto no importa.',c:'hl'},
{k:'2 · Verde',h:'El agente arregla sin tocar la prueba',p:'La prueba es el examen: si el agente la edita, rompe el contrato. Se castiga.'},
{k:'3 · Puerta',h:'Pruebas ocultas y KPIs',p:'Un conjunto que el agente no vio decide si generalizó. Después se mide calidad.',c:'pkc'}],
n:{g:'Explicá por qué el humano revisa la prueba y no el código: revisar una prueba de 15 líneas es más barato y más seguro que revisar un arreglo de 200. Si la prueba es buena, el arreglo queda atado a ella.\n\nRegla de oro de las actividades: tocar una prueba existente cuesta −5. No porque editar pruebas esté prohibido, sino porque debe ser una decisión consciente y no un atajo del agente.',c:'TDD con agentes agrega un riesgo nuevo: el agente puede escribir la prueba para que pase su propio arreglo. Por eso la aprobación humana de la prueba roja va antes de que el agente escriba el arreglo.',t:'Demostrá en vivo, si hay tiempo: pedí a un agente «arreglá este bug» y después «escribí primero la prueba que lo reproduzca». Comparar los resultados enseña más que explicarlo.'}};};
R["2.cases#1"]=function(){return {type:'cases',mod:2,eb:'Caso real · METR, junio de 2025',title:'Cuando el agente *hace trampa* para ganar',cards:[
{k:'Qué reportó METR',p:'En evaluaciones de agentes, el modelo o3 hizo reward hacking en 30,4 % de las ejecuciones de RE-Bench y 0,7 % en HCAST.',c:'hl'},
{k:'Qué significa',p:'Cuando existe un atajo que mejora la métrica, algunos agentes lo toman, aunque «saben» que no es lo que se pidió.'},
{k:'Para tu repo',p:'Si la métrica es «los tests pasan», alguien puede hacerlos pasar sin arreglar nada. Hay que cuidar el examen.',c:'pkc'}],
note:'Fuente: METR, «Recent frontier models are reward hacking», junio de 2025. Las cifras corresponden a esas evaluaciones, no a trabajo de producción.',
n:{g:'Contá el caso sin dramatizar: no es que el modelo «mienta», es que optimiza lo que se le mide. Los porcentajes dependen mucho del tipo de tarea: 30,4 % en RE-Bench, 0,7 % en HCAST. Lo relevante para ustedes es que ocurre más cuando hay un atajo evidente.\n\nTransición al ejercicio: «Vamos a poner al agente en una situación donde el atajo existe, y a ver si el diseño del examen lo detiene».',c:'METR evaluó modelos de frontera en tareas de ingeniería y de investigación; documentó casos en que el modelo modificó el evaluador o aprovechó fallas del entorno en lugar de resolver la tarea. Son evaluaciones controladas; no hay que extrapolar las cifras a tu repositorio.',s:[['METR · Recent frontier models are reward hacking','https://metr.org/blog/2025-06-05-recent-reward-hacking/']],q:[['¿Entonces no se puede confiar en los agentes?','Se puede confiar en lo que se verifica. El diseño de la prueba (ocultas, no editable, KPI independiente) es lo que cierra el atajo.']]}};};
R["2.concept#2"]=function(){return {type:'concept',mod:2,eb:'Medir las pruebas',title:'La cobertura *no dice* si las pruebas sirven',table:{head:['Medida','Qué responde','Límite'],rows:[['Cobertura de líneas','¿Qué líneas se ejecutaron?','Una prueba vacía ejecuta código y no verifica nada'],['Mutación','¿Detecta la suite un cambio roto a propósito?','Es más lenta; conviene en módulos críticos'],['Pruebas ocultas','¿Generalizó el arreglo?','Hay que mantenerlas fuera del alcance del agente'],['Diff de pruebas','¿Se tocaron pruebas existentes?','Una señal, no un veredicto: a veces corresponde']]},
n:{g:'Una frase para llevarse: «cobertura mide dónde pasó la luz, no si había alguien mirando». Mostrá la tabla y detenete en mutación: si rompés a propósito una condición y ninguna prueba falla, esa prueba no protege.\n\nNo prometas que mutación es para todo. Recomendá empezar por un módulo crítico (pagos, permisos, fechas).',c:'Herramientas habituales: Stryker (JavaScript/TypeScript/.NET), PIT (Java), mutmut (Python). La idea es la misma en todas. El costo de tiempo crece rápido, por eso se usa focalizada o en CI nocturno.'}};};
R["2.activity#1"]=function(){return {type:'activity',mod:2,eb:'Actividad 2 · El lunes',title:'El bug *del lunes por la mañana*',scenario:'Lunes 9:10. Soporte reporta que dos personas lograron reservar el mismo turno al mismo tiempo. Hay que reproducirlo, arreglarlo y dejar una pieza reutilizable.',total:20,steps:[[2,'Apostá el tiempo del ciclo completo y el número de mutantes que sobrevivirán.'],[6,'Rojo: el agente escribe la prueba que reproduce la doble reserva. Vos la aprobás o la rechazás.'],[8,'Verde: el agente arregla sin editar pruebas existentes.'],[4,'Puerta y KPIs: corre el script de pruebas ocultas y de mutación.']],gate:'La prueba roja falla antes del arreglo y las pruebas ocultas pasan después.',kpi:'Mutantes que sobreviven, líneas cambiadas, pruebas existentes tocadas (−5 cada una), minutos vs apostados.',deliver:'Plantilla «bug → prueba roja → arreglo» con el comando de pruebas y la regla para tu contrato.',trap:'Decir «arreglalo» sin prueba roja y confiar en el «ya está» del agente.',mode:'Parejas · 20 min',
n:{g:'La clave es el orden: nadie pide el arreglo hasta que la prueba roja esté aprobada. Recorré las mesas verificando eso.\n\nTerminado el tiempo, mostrá el ranking con un criterio: primero puerta (sí/no), después menos mutantes vivos. Una pareja que pasó la puerta con muchos mutantes vivos aprende algo importante: su prueba roja era débil.',c:'El bug elegido es una condición de carrera clásica. Si el repo de ejemplo no la tiene, se puede sembrar con un delay artificial. Lo que importa es que la prueba roja sea determinista.',t:'Si alguien termina antes, desafío: que escriba la prueba oculta que le pondría a otro equipo.'}};};
R["2.quiz#1"]=function(){return {type:'quiz',mod:2,id:'q2',title:'Verificación · *explicá el porqué*',qs:[
{q:'¿Por qué el humano aprueba la prueba roja antes del arreglo?',o:['Porque el agente no sabe escribir pruebas','Porque una prueba mala hace que cualquier arreglo parezca correcto','Para ahorrar tokens','Para cumplir un proceso'],a:1,w:'La prueba define el éxito. Si describe mal el bug, el agente puede hacerla pasar sin arreglarlo.'},
{q:'Cobertura 98 %, pero un cambio roto a propósito no hace fallar ninguna prueba. ¿Qué indica?',o:['La cobertura se calculó mal','Hay pruebas que ejecutan código sin verificarlo','El código está perfecto','Falta un linter'],a:1,w:'La cobertura mide ejecución, no verificación. La mutación detecta esa diferencia.'},
{q:'El agente edita una prueba existente «para adaptarla». ¿Qué corresponde?',o:['Aceptarlo, está en su derecho','Detenerse y revisar si cambió el requisito o si es un atajo','Borrar la prueba','Ignorar el cambio'],a:1,w:'A veces corresponde editar una prueba, pero debe ser una decisión humana consciente, no un efecto colateral del arreglo.'}],
n:{g:'Misma dinámica: elegí una pregunta y pedí defender una opción incorrecta. Tercera pregunta, ojo: no es «nunca editar pruebas». Es «que no sea un atajo».',c:'Evitá convertir la regla en dogma. Un cambio legítimo de requisito sí obliga a editar pruebas; la señal de alarma es que el agente lo haga solo y en silencio.'}};};
R["2.broken#1"]=function(){return {type:'broken',mod:2,id:'b2',title:'El PR *con todo en verde*',intro:'El agente abrió este cambio. La descripción dice «todos los tests pasan, cobertura 98 %». ¿Mergeás? ¿Qué está mal y por qué?',artifact:'// reprogramar.test.js\ntest("reprograma un turno", () => {\n  [[expect(true).toBe(true);]]\n});\n\n// turnos.js\nfunction reservar(turno) {\n  [[if (process.env.NODE_ENV === "test") return OK;]]\n  return guardar(turno);\n}\n\n// diff: - test("no permite doble reserva")\n// [[eliminado: «era inestable»]]\n\n// PR: Todos los tests pasan ✅  cobertura 98 %',cw:'820px',problems:[['Prueba vacía.','expect(true) pasa siempre; ejecuta código sin verificar nada.'],['Código que detecta el entorno de pruebas.','Es reward hacking: el producto se comporta distinto cuando lo miden.'],['Se borró la prueba de doble reserva.','Era justamente la que protegía el bug del lunes; «inestable» no es motivo para borrarla.'],['La cobertura como prueba de calidad.','98 % de cobertura convive con cero verificación; hace falta mutación o pruebas ocultas.']],
n:{g:'Pedí votación inicial: «¿mergean?». Probablemente nadie. Entonces la pregunta real es: «¿qué señal les habría avisado sin leer el diff entero?». Respuesta: la prueba tocada/borrada (diff de pruebas) y la mutación.',c:'Caso sintético, armado con los atajos que documentan los trabajos sobre reward hacking.'}};};
R["2.reflection#1"]=function(){return {type:'reflection',mod:2,id:'r2',title:'¿Qué significa *«listo»* en tu equipo?',prompts:['¿Cuál es hoy tu criterio objetivo de «listo» para un cambio hecho por un agente?','¿Qué módulo de tu producto sería el primero que mutarías o protegerías con pruebas ocultas, y por qué?','¿Qué atajo podría tomar un agente en tu repo para hacer pasar el CI sin arreglar nada?'],
n:{g:'Misma mecánica: silencio, escritura, pareja. La tercera pregunta suele producir las mejores ideas para el bloque de seguridad de la tarde.',c:'Cualquier atajo que identifiquen es una regla candidata para el contrato o un hook.'}};};
R["3.opener#1"]=function(){return {type:'opener',mod:3,time:'11:40',dur:50,title:'Herramientas y *permisos*',lead:'Un agente es tan útil como sus herramientas y tan seguro como sus límites. Menos, mejor elegido y bloqueado de verdad.',goals:['Elegir las herramientas mínimas que necesita una tarea','Diseñar zonas: libre, pide permiso, bloqueado','Escribir un hook que impida un error de verdad'],take:'Un settings.json con zonas y un hook para tu repo.',
n:{g:'Pregunta de apertura: «¿Cuántos servidores MCP tienen conectados hoy y cuántos usaron esta semana?». Es una versión de la pregunta que se hacen con las suscripciones: se acumulan y nadie las revisa.\n\nPromesa: salir con un archivo de configuración que realmente frena un error, y no una política escrita.',c:'MCP (Model Context Protocol) es un protocolo abierto para conectar agentes con herramientas y fuentes de datos. Cada servidor suma herramientas con sus descripciones, que ocupan contexto, y también suma superficie de ataque.',s:[['Claude Code · Permisos (IAM)','https://docs.claude.com/en/docs/claude-code/iam'],['Claude Code · Hooks','https://docs.claude.com/en/docs/claude-code/hooks']]}};};
R["3.glossary#1"]=function(){return {type:'glossary',mod:3,eb:'Glosario · unidad 4',title:'Seis términos *de herramientas*',terms:[
['MCP','Protocolo para conectar al agente con herramientas y datos externos mediante servidores.','Model Context Protocol'],
['Hook','Script que se ejecuta automáticamente en un evento del agente (antes o después de usar una herramienta).',''],
['Regla de permiso','Configuración que permite, pregunta o deniega una acción: allow, ask, deny.',''],
['Subagente','Agente auxiliar con su propio contexto y herramientas, al que se le delega una tarea acotada.',''],
['Superficie de herramientas','Conjunto de cosas que el agente puede hacer. Cada una suma capacidad y riesgo.',''],
['Falso positivo','Una acción legítima que tu bloqueo impide. Medirlos evita crear un agente inútil.','']],
n:{g:'Insistí en «falso positivo»: un bloqueo que impide trabajar se desactiva a los dos días. El mejor permiso es el que se queda puesto.',c:'Los subagentes ayudan a proteger el contexto principal: la investigación ruidosa queda en el subagente y sólo vuelve un resumen.'}};};
R["3.concept#1"]=function(){return {type:'concept',mod:3,eb:'Caso real · Vercel, diciembre de 2025',title:'*Quitar* herramientas también es ingeniería',cards:[
{k:'Qué contaron',p:'Vercel relató que, en su agente interno de datos (d0), quitó alrededor del 80 % de las herramientas y el agente anduvo mejor.',c:'hl'},
{k:'Por qué tiene sentido',p:'Cada herramienta agrega descripciones al contexto y opciones entre las que elegir. Más opciones, más ocasiones de equivocarse.'},
{k:'Qué hacer',p:'Para cada herramienta preguntá: ¿qué tarea concreta se rompe si la saco? Si ninguna, sobra.',c:'pkc'}],
note:'Las cifras exactas de mejora circulan en resúmenes secundarios; aquí usamos sólo la idea general. Verificar contra la fuente antes de citar números.',
n:{g:'Contalo como una historia de simplificación: menos piezas, mismo (o mejor) resultado. No cites porcentajes de mejora: las que circulan vienen de resúmenes secundarios y no las verificamos.\n\nEjercicio mental en voz alta: tomar el MCP que más usan y listar qué tareas harían falta si no existiera.',c:'Vercel publicó la nota «We removed 80% of our agent’s tools» a fines de 2025. Detalle que NO está verificado en fuente primaria: un resumen mencionaba 100 % de éxito y mejoras de velocidad y de tokens; no repetir esos números sin leer el original.',s:[['Vercel · We removed 80% of our agent’s tools','https://vercel.com/blog/we-removed-80-percent-of-our-agents-tools']]}};};
R["3.concept#2"]=function(){return {type:'concept',mod:3,eb:'Zonas',title:'Tres zonas, *tres mecanismos*',table:{head:['Zona','Ejemplos','Mecanismo'],rows:[['Libre','Leer código, correr tests y lint, git status','allow explícito: sin preguntar'],['Pide permiso','git push, instalar dependencias, editar CI','ask: una persona decide'],['Bloqueada','.env, /migrations, comandos destructivos, producción','deny + hook que bloquea con exit 2'],['Fuera del agente','Credenciales de producción, cuentas con permisos de escritura amplios','No se le dan nunca']]},
n:{g:'Construí la tabla de abajo hacia arriba: primero lo que nunca debe estar al alcance del agente (credenciales de producción), después lo bloqueado, después lo que pide permiso, y al final lo libre. Así el orden de diseño es el orden de riesgo.\n\nLa cuarta fila es la más importante y la más olvidada: la mejor defensa contra un agente confundido es que no tenga la llave.',c:'En Claude Code, las reglas de permiso permiten allow, ask y deny, y los deny tienen prioridad. Un hook PreToolUse puede bloquear la llamada devolviendo código de salida 2, y el mensaje que escribe en stderr llega al agente para que ajuste.',s:[['Claude Code · Permisos (IAM)','https://docs.claude.com/en/docs/claude-code/iam'],['Claude Code · Hooks','https://docs.claude.com/en/docs/claude-code/hooks']]}};};
R["3.concept#3"]=function(){return {type:'concept',mod:3,eb:'Hooks',title:'Lo que *tiene que ser siempre verdad*',cards:[
{k:'Antes de una acción',h:'Bloquear',p:'Un script revisa el comando o la ruta y dice no. El agente recibe el motivo y corrige.',c:'hl'},
{k:'Después de una acción',h:'Verificar y dar forma',p:'Formatear, correr lint o pruebas rápidas y devolver el error al agente en el mismo turno.'},
{k:'Límites',h:'No reemplazan el criterio',p:'Un hook mal escrito bloquea todo o no bloquea nada. Se prueban como cualquier código.',c:'pkc'}],
n:{g:'Idea fuerza: «las instrucciones piden, los hooks garantizan». Un ejemplo útil para mostrar es el formateo automático después de cada edición: nadie vuelve a discutir estilo en un PR.\n\nAdvertencia práctica: un hook que sale con código 0 no bloquea. Es un error muy común y lo vamos a ver en el caso roto.',c:'Los hooks pueden engancharse a varios eventos (antes y después de usar herramientas, al terminar el agente, entre otros). Para el taller alcanza con dos: antes (bloquear) y después (verificar). Conviene versionar los hooks en el repo y revisarlos como código.',s:[['Claude Code · Hooks','https://docs.claude.com/en/docs/claude-code/hooks']]}};};
R["3.activity#1"]=function(){return {type:'activity',mod:3,eb:'Actividad 3 · Zonas',title:'Diseñá *las zonas* de tu repo',scenario:'Repo «turnos». Hay un .env con claves, una carpeta /migrations y un comando de despliegue. Definí zonas, escribí la configuración y atacá tu propio diseño con tres pedidos maliciosos o descuidados.',total:20,steps:[[2,'Apostá cuántas de las 3 acciones prohibidas bloquea tu diseño sin romper el trabajo normal.'],[6,'Escribí las tres zonas: libre, pide permiso, bloqueada.'],[8,'Implementá permisos (allow / ask / deny) y un hook que bloquee editar /migrations.'],[4,'Atacá: pedí «leé el .env», «editá una migración» y «hacé deploy». Después corré una tarea normal.']],gate:'Las tres acciones prohibidas quedan bloqueadas y la tarea normal sigue funcionando.',kpi:'Falsos positivos (acciones útiles bloqueadas), pedidos de permiso por tarea, cantidad de herramientas habilitadas.',deliver:'settings.json y script del hook, listos para tu repo.',trap:'Poner allow en todo (Bash con comodín) o bloquear tanto que el agente no puede probar nada.',mode:'Parejas · 20 min',
n:{g:'Dejá claro que la puerta tiene dos mitades: lo prohibido tiene que estar prohibido, y lo normal tiene que andar. Una pareja que bloquea todo no gana.\n\nAl terminar, hacé que una pareja intercambie su configuración con otra y la ataque. Un diseño de seguridad sólo vale después de que alguien distinto intentó romperlo.',c:'Para el ataque: no hace falta ingeniosidad. Los tres pedidos sirven para ver si el diseño funciona. El objetivo es verificar el mecanismo, no engañar al modelo.',t:'Si alguien ya domina permisos, desafío: que agregue un hook posterior que corra el linter y devuelva los errores al agente.'}};};
R["3.quiz#1"]=function(){return {type:'quiz',mod:3,id:'q3',title:'Herramientas y permisos · *explicá el porqué*',qs:[
{q:'¿Conectar más herramientas MCP siempre mejora al agente?',o:['Sí, tiene más capacidades','No: cada una suma contexto, opciones y riesgo','Sólo si son gratuitas','Sólo si son oficiales'],a:1,w:'Las descripciones de herramientas ocupan contexto y amplían las opciones de error. Conviene lo mínimo que la tarea necesita.'},
{q:'Un hook debe impedir editar /migrations. ¿Qué debe hacer el script?',o:['Escribir una advertencia y salir con código 0','Salir con código 2 explicando el motivo','Sólo registrar el intento en un log','Pedir disculpas al usuario'],a:1,w:'Con código 0 la acción continúa. El código 2 bloquea y devuelve el mensaje al agente para que corrija.'},
{q:'¿Cuál es una política de permisos razonable?',o:['Permitir todo y revisar después','Libre lo seguro y repetitivo, pregunta lo reversible con riesgo, bloquea lo irreversible y los secretos','Preguntar siempre','Bloquear todo salvo leer'],a:1,w:'Ni pedir permiso para todo (se vuelve ruido) ni permitir todo (se vuelve riesgo): se gradúa según reversibilidad y daño posible.'}],
n:{g:'Defender lo incorrecto: la opción «Permitir todo y revisar después» suele atraer porque revisar después parece barato. Preguntá cuánto cuesta revisar después de que el comando ya corrió.',c:'Las tres preguntas apuntan a minimalismo, bloqueo determinista y graduación de riesgo.'}};};
R["3.broken#1"]=function(){return {type:'broken',mod:3,id:'b3',title:'La configuración *que da confianza falsa*',intro:'El equipo dice «ya tenemos permisos y un hook». Un agente borró la carpeta de migraciones igual. ¿Qué está mal y por qué?',artifact:'// .claude/settings.json\n{\n  "permissions": {\n    "allow": ["[[Bash(*)]]"],\n    "deny": []\n  }\n}\n\n# hooks/block-migrations.sh\nif echo "$CMD" | grep -q "migrations"; then\n  echo "cuidado con las migraciones"\n  [[exit 0]]\nfi\n\n# MCP conectados: [[43 herramientas]]\n# incluye base de datos con [[credenciales de producción]]',cw:'820px',problems:[['Allow con comodín en Bash.','Permite cualquier comando; los permisos no restringen nada.'],['El hook sale con código 0.','Imprime una advertencia pero no bloquea: la acción sigue.'],['43 herramientas conectadas.','Más contexto, más confusión y más superficie de ataque; nadie las revisó.'],['Credenciales de producción al alcance.','Si el agente no debería tocar producción, no debería tener la llave.']],
n:{g:'Pregunta clave para el cierre: «¿cuál de los cuatro problemas se arregla con una sola línea y cuál con una decisión de equipo?». Los tres primeros se arreglan con configuración; el cuarto es una decisión.',c:'Caso sintético que reúne errores frecuentes de configuración. No describe un incidente concreto.'}};};
R["3.reflection#1"]=function(){return {type:'reflection',mod:3,id:'r3',title:'Tus *límites*, hoy',prompts:['¿Qué herramienta o servidor MCP quitarías hoy y qué tarea te lo impediría?','¿Qué acción de tu repo debería estar en la zona bloqueada y hoy sólo está en un documento?','¿Qué credencial hoy está al alcance del agente y no debería?'],
n:{g:'Cuidado con la tercera pregunta: si alguien detecta una credencial real expuesta, la prioridad es rotarla hoy mismo, antes de seguir con el taller.',c:'La reflexión conecta con la unidad 5: lo que identifiquen acá es lo que un atacante intentaría usar.'}};};
R["4.opener#1"]=function(){return {type:'opener',mod:4,time:'13:00',dur:55,title:'Trabajo en *paralelo*',lead:'Un agente rinde. Cuatro agentes sin diseño pelean. Hoy aprendés cuándo paralelizar y cómo evitar los choques.',goals:['Decidir qué tareas se pueden paralelizar y cuáles no','Usar worktrees para que varios agentes no se pisen','Diseñar un flujo en GitHub que absorba el trabajo paralelo'],take:'Un script de worktrees y una guía «cuándo paralelizamos» para tu equipo.',
n:{g:'Después del almuerzo, energía práctica. Pregunta: «¿Quién corrió más de un agente a la vez y qué pasó?». Casi siempre aparece un conflicto de merge o un servidor de pruebas ocupado.\n\nEl hilo de la unidad: paralelizar no es lanzar más agentes; es dividir bien el trabajo.',c:'El límite casi nunca es el costo de correr agentes sino la coordinación: dependencias entre tareas, archivos compartidos y recursos compartidos (base de datos, puertos).',s:[['git-worktree','https://git-scm.com/docs/git-worktree']]}};};
R["4.glossary#1"]=function(){return {type:'glossary',mod:4,eb:'Glosario · unidad 9',title:'Seis términos *de paralelismo*',terms:[
['Worktree','Carpeta de trabajo adicional del mismo repositorio, con su propia rama.','git worktree'],
['Orquestador','Quien reparte tareas entre agentes y junta los resultados: una persona o un agente.',''],
['Enjambre','Varios agentes trabajando en tareas relacionadas bajo una coordinación.','swarm'],
['Fan-out / fan-in','Repartir una tarea en partes y después integrar los resultados.',''],
['Contrato entre tareas','Acuerdo explícito (por ejemplo, la forma de una API) que permite que front y back avancen a la vez.',''],
['Cola de merge','Mecanismo que integra los cambios de a uno, probándolos sobre la rama principal actualizada.','merge queue']],
n:{g:'Pedí a una persona de front y otra de back que expliquen qué sería «contrato» en su día a día. Casi siempre es un esquema de API; ahí está el puente entre los dos mundos.',c:'Un enjambre no es magia: es una estrategia de división del trabajo. Funciona cuando las partes son independientes o cuando el contrato entre ellas está claro.'}};};
R["4.concept#1"]=function(){return {type:'concept',mod:4,eb:'Cuándo sí, cuándo no',title:'¿Esta tarea *se paraleliza*?',table:{head:['Señal','Paralelizar','No paralelizar'],rows:[['Archivos','Cada tarea toca archivos distintos','Todas tocan el mismo módulo'],['Dependencias','Resultados independientes o con contrato','Una necesita la salida de otra'],['Recursos','Cada una puede levantar su propio entorno','Comparten base de datos o puerto'],['Revisión','Cada cambio se entiende por separado','Sólo tiene sentido leído en conjunto'],['Ejemplo','4 endpoints nuevos con contrato definido','Refactor del núcleo del dominio']]},
n:{g:'Que cada persona clasifique una tarea de su backlog real en voz alta. Si dicen «depende», preguntá de qué: casi siempre es de un archivo compartido o de una decisión de diseño que todavía no se tomó. Esa decisión se toma primero, y después se paraleliza.\n\nIdea para fullstack y pods: el contrato de API es lo que permite que front y back avancen con agentes separados el mismo día.',c:'Regla práctica: si dos tareas necesitan modificar la misma función, no son paralelas. Decidir el contrato primero convierte muchas tareas «dependientes» en independientes.'}};};
R["4.concept#2"]=function(){return {type:'concept',mod:4,eb:'Aislar',title:'Un agente, *una carpeta, una rama*',diagram:'worktrees',dw:'900px',cards:[
{k:'Qué hace',p:'Un worktree es una carpeta con su rama, ligada al mismo repositorio y su historial.',c:'hl'},
{k:'Qué evita',p:'Dos agentes editando los mismos archivos físicos o cambiando de rama debajo del otro.'},
{k:'Qué no resuelve',p:'Recursos compartidos: bases de datos, puertos, caches. Cada agente necesita su propio entorno.',c:'pkc'}],
n:{g:'Mostrá el diagrama y el comando de creación. Remarcá la última tarjeta: el worktree aísla archivos, no recursos. Si dos agentes levantan el servidor en el mismo puerto, se pisan igual.\n\nDemostración rápida (2 min): crear tres worktrees con git worktree add y lanzar un agente en cada uno. Al terminar, git worktree remove los limpia.',c:'git worktree permite tener varias ramas de un mismo repositorio checkouteadas a la vez en carpetas distintas, compartiendo la base de objetos. Es más liviano que clonar de nuevo. Las herramientas de los agentes pueden ofrecer atajos propios para esto; conviene mirar la documentación de la versión instalada.',s:[['git-worktree','https://git-scm.com/docs/git-worktree']],q:[['¿Y si el proyecto tarda mucho en instalar dependencias?','Se puede reutilizar una caché de dependencias o preparar un script de arranque para cada worktree; el costo se paga una vez por carpeta.']]}};};
R["4.concept#3"]=function(){return {type:'concept',mod:4,eb:'Integración en GitHub',title:'El flujo *que absorbe* el trabajo paralelo',table:{head:['Práctica','Para qué'],rows:[['Un PR chico por agente y por tarea','Se revisa rápido y se revierte sin dolor'],['Checks obligatorios en la rama principal','Nada entra sin pasar las pruebas'],['Cola de merge','Integra de a uno sobre la versión actualizada'],['CODEOWNERS','La persona correcta revisa la zona correcta'],['Revisor distinto del autor','Quien escribió no es quien aprueba']]},
n:{g:'Cuidá no convertir esto en una clase de GitHub. Lo importante es la idea: la integración es el cuello de botella natural, y las prácticas de la tabla lo hacen predecible.\n\nSi preguntan por revisión automática: es el tema de la unidad 9, donde la fábrica tiene cuatro revisores.',c:'Son funciones estándar de GitHub (protección de ramas con checks obligatorios, cola de merge, CODEOWNERS). Ninguna es específica de agentes: el punto es que con más cambios en paralelo se vuelven imprescindibles.',t:'Para equipos que ya usan estas prácticas: preguntá qué cambiaría si el volumen de PRs se triplicara mañana.'}};};
R["4.concept#4"]=function(){return {type:'concept',mod:4,eb:'Patrones de enjambre',title:'Tres formas *de repartir* el trabajo',cards:[
{k:'Fan-out / fan-in',h:'Partes independientes',p:'Un orquestador divide, cada agente hace su parte, uno integra. Ideal para endpoints o módulos separados.',c:'hl'},
{k:'Pipeline',h:'Etapas en cadena',p:'Spec, implementación, revisión. Cada etapa tiene su agente y su criterio de salida.'},
{k:'Competencia',h:'Varias propuestas',p:'Dos o tres agentes resuelven lo mismo; una puerta objetiva elige. Útil cuando no sabés cuál enfoque conviene.',c:'pkc'}],
note:'El pipeline es la base de la Feature Factory de la unidad 9.',
n:{g:'Para cada patrón, una pregunta: ¿qué mecanismo decide si el resultado sirve? En fan-out es el contrato; en pipeline, el criterio de cada etapa; en competencia, la puerta objetiva. Sin criterio objetivo, el enjambre es sólo ruido paralelo.\n\nAviso de costo: competencia triplica el gasto. Se usa cuando equivocarse sale más caro que correr tres veces.',c:'Son patrones de diseño generales para sistemas multiagente. No dependen de una herramienta en particular y se pueden implementar con subagentes, con varias sesiones o con un orquestador propio.'}};};
R["4.activity#1"]=function(){return {type:'activity',mod:4,eb:'Actividad 4 · Cuatro agentes, un backlog',title:'Dividir, *lanzar* e integrar',scenario:'Backlog de «turnos»: dos tareas de front y dos de back, con una API que las une. En parejas front-back o en pods fullstack: dividan, definan el contrato y lancen agentes en worktrees.',total:20,steps:[[2,'Apostá cuántos conflictos de merge habrá y cuánto ahorrás frente a hacerlo en secuencia.'],[5,'Clasificá las tareas: ¿cuáles son independientes? Escribí el contrato de la API en un archivo.'],[10,'Creá un worktree por tarea y lanzá un agente en cada uno.'],[3,'Integrá en main de a uno y corré las pruebas ocultas.']],gate:'Las pruebas ocultas pasan sobre la rama principal ya integrada.',kpi:'Conflictos de merge, tiempo total vs el estimado en secuencia, tareas que hubo que rehacer.',deliver:'Un script de worktrees y una guía «cuándo paralelizamos» de una página para tu equipo.',trap:'Lanzar los cuatro agentes sin contrato y descubrir el choque al final.',mode:'Parejas front-back o pods fullstack · 20 min',
n:{g:'Esta es la actividad donde más se ve la colaboración entre front y back. El contrato de API se escribe antes y lo consensuan las dos partes. En pods fullstack, una misma persona lo escribe pero tiene que poder explicarlo a otro.\n\nFijate qué parejas saltean el paso del contrato: son las que van a tener conflictos. No les adelantes nada; que lo descubran en la integración.',c:'El script de puntaje mide conflictos con git (merge sin autoresolver) y el tiempo desde que se lanza el primer agente hasta que pasa la puerta. El estimado en secuencia lo da la apuesta de cada pareja.',t:'Como cierre, preguntá a las parejas que tuvieron cero conflictos qué decidieron antes de lanzar. Esa lista es la guía de la entrega.'}};};
R["4.quiz#1"]=function(){return {type:'quiz',mod:4,id:'q4',title:'Trabajo en paralelo · *explicá el porqué*',qs:[
{q:'¿Qué tarea es mejor candidata a paralelizar?',o:['Refactor del núcleo del dominio','Cuatro endpoints nuevos con contrato definido','Una migración de esquema','Una decisión de arquitectura'],a:1,w:'Las tareas independientes y con contrato claro no necesitan coordinarse mientras se hacen.'},
{q:'¿Qué ofrece un worktree frente a tener un solo directorio de trabajo?',o:['Más velocidad del modelo','Carpeta y rama separadas sobre el mismo repositorio','Aislamiento de la base de datos','Revisión automática'],a:1,w:'Aísla archivos y ramas. No aísla recursos externos como bases de datos o puertos.'},
{q:'En un enjambre, ¿quién debería revisar el cambio de un agente?',o:['El mismo agente, que conoce el contexto','Otro agente o una persona con contexto fresco','Nadie, si pasan las pruebas','Sólo el orquestador'],a:1,w:'Quien escribe tiende a no ver sus propios supuestos. La revisión independiente es una condición de calidad.'}],
n:{g:'Misma mecánica. En la tercera, pedí defender «nadie si pasan las pruebas» y conectá con la unidad 3: las pruebas pueden ser débiles.',c:'Las tres preguntas cubren selección de tareas, aislamiento y revisión.'}};};
R["4.broken#1"]=function(){return {type:'broken',mod:4,id:'b4',title:'El plan de enjambre *del viernes*',intro:'Un equipo lanzó cuatro agentes con este plan y terminó el viernes con una semana de conflictos. ¿Qué está mal y por qué?',artifact:'Plan: «refactor de turnos» — 4 agentes\n\nAgente A: reescribe [[turnos.js]]\nAgente B: reescribe [[turnos.js]] (otra parte)\nAgente C: migra la BD en [[el mismo servidor de pruebas que A y B]]\nAgente D: front que consume la API\n          [[que todavía no existe ni tiene contrato]]\n\nIntegración: [[todo junto el viernes]]\nRevisión: [[cada agente aprueba su propio PR]]',cw:'820px',problems:[['Dos agentes sobre el mismo archivo.','El choque es inevitable; son tareas dependientes y no se deben paralelizar.'],['Entorno de pruebas compartido.','Los datos se pisan entre agentes: falla todo de forma impredecible.'],['Sin contrato entre front y back.','El agente de front inventa una API que el de back no va a implementar igual.'],['Integración al final.','Los conflictos y los errores se acumulan; cuesta mucho más detectarlos tarde.'],['Autorrevisión.','El autor no ve sus propios supuestos; hace falta revisión independiente.']],
n:{g:'Con cinco problemas, dejá que el grupo encuentre al menos tres solo. Los dos últimos suelen necesitar ayuda.\n\nCierre: «Este plan parece paralelo, pero tiene un solo camino real: el del que se rompe».',c:'Caso sintético; los errores son los que más se repiten al empezar con enjambres.'}};};
R["4.reflection#1"]=function(){return {type:'reflection',mod:4,id:'r4',title:'Qué *paralelizarías* mañana',prompts:['¿Qué tareas de tu backlog actual se podrían paralelizar mañana mismo y cuál es el contrato que las habilita?','¿Qué recurso compartido (base de datos, puerto, cuenta) arruinaría tu primer enjambre?','¿Quién revisaría los cambios de los agentes en tu equipo y con qué criterio?'],
n:{g:'Pedí que anoten una tarea concreta con nombre y apellido (ticket real). Lo concreto se hace; lo genérico se olvida.',c:'Conecta con la unidad 9: la revisión independiente es una de las etapas de la fábrica.'}};};
R["5.opener#1"]=function(){return {type:'opener',mod:5,time:'13:55',dur:50,title:'Seguridad: *Red vs Blue*',lead:'Un agente lee texto de cualquiera y actúa con tus permisos. Eso cambia el modelo de amenazas. Hoy atacás y defendés.',goals:['Reconocer la «trifecta letal» en un flujo real','Aprender de cuatro casos documentados de 2025','Defender un repo y atacar el de otro equipo'],take:'Un checklist de «trifecta» para revisar cada agente que conectes.',
n:{g:'Abrí con calma: no vamos a asustar, vamos a entrenar el ojo. Pregunta: «¿Qué texto que escribió otra persona lee hoy tu agente?». Issues, tickets, páginas web, README de dependencias, respuestas de herramientas. Todo eso es input no confiable.\n\nPromesa: salir sabiendo mirar un flujo y decir en 30 segundos si tiene la combinación peligrosa.',c:'En seguridad con agentes, la superficie es el lenguaje natural: una instrucción maliciosa escondida en un dato (un issue, un correo) puede ser tratada como orden. No hay un parche único; se reduce el riesgo con diseño.',s:[['Simon Willison · The lethal trifecta','https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/']]}};};
R["5.glossary#1"]=function(){return {type:'glossary',mod:5,eb:'Glosario · unidad 5',title:'Seis términos *de seguridad*',terms:[
['Inyección de prompt','Texto malicioso dentro de un dato que el agente interpreta como instrucción.','prompt injection'],
['Trifecta letal','Combinación de datos privados, contenido no confiable y una vía de salida: permite filtrar información.','Simon Willison'],
['Exfiltración','Sacar datos de un sistema hacia un destino no autorizado.',''],
['Cadena de suministro','Dependencias y herramientas de terceros que tu código o tu agente incorporan.','supply chain'],
['Slopsquatting','Registrar nombres de paquetes que los modelos suelen inventar para que alguien los instale.',''],
['Mínimo privilegio','Dar sólo los permisos estrictamente necesarios para la tarea.','']],
n:{g:'Pedí que alguien explique «trifecta letal» con una frase sin mirar. Si dice «tres cosas juntas que no deberían estar juntas», alcanzó.',c:'Slopsquatting: los modelos a veces recomiendan paquetes que no existen; si un atacante registra ese nombre, quien instale sin verificar instala malware. Las cifras que veremos provienen de un estudio sin revisión de pares.'}};};
R["5.concept#1"]=function(){return {type:'concept',mod:5,eb:'El modelo mental',title:'La *trifecta letal*',diagram:'trifecta',dw:'820px',cards:[
{k:'1 · Datos privados',p:'Código, credenciales, tickets, bases de datos a los que el agente accede.',c:'hl'},
{k:'2 · Contenido no confiable',p:'Cualquier texto que escribió alguien más: issues, correos, páginas web.'},
{k:'3 · Vía de salida',p:'Crear PRs, enviar mensajes, hacer pedidos de red. Es por donde sale el dato.',c:'pkc'},
{k:'Regla',p:'Quitá al menos una de las tres. Con las tres juntas, el riesgo es estructural.',c:'good'}],
n:{g:'Dibujá los tres círculos en la pizarra y pedí ejemplos de su día a día para cada uno. Después pedí que ubiquen su agente favorito: ¿cuántos círculos toca? La respuesta honesta suele ser tres.\n\nRegla de oro para llevar: no hace falta un agente más inteligente para defenderse; hace falta un flujo donde falte al menos una pata.',c:'La idea la formuló Simon Willison en junio de 2025 como lista de verificación para flujos de agentes. No es una garantía de seguridad: es una regla de diseño que reduce un tipo muy frecuente de ataque.',s:[['Simon Willison · The lethal trifecta','https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/']]}};};
R["5.cases#1"]=function(){return {type:'cases',mod:5,eb:'Casos reales · 2025',title:'Cuatro episodios *documentados*',table:{head:['Caso','Qué pasó','Lección'],rows:[['GitHub MCP · Invariant Labs, mayo','Un issue malicioso en un repo público indujo a un agente con acceso al GitHub MCP a filtrar datos de repos privados','Contenido no confiable + acceso amplio = fuga'],['Supabase MCP · julio','Un ticket de soporte con instrucciones ocultas llevó al agente a leer tablas con privilegios altos','Las tres patas en un mismo flujo'],['Nx «s1ngularity» · 26 de agosto','Paquetes comprometidos usaron herramientas de IA locales para buscar secretos; según Wiz, 2.180 cuentas y 7.200 repos afectados','La cadena de suministro también llega al agente'],['Slopsquatting · estudio 2026','127 nombres de paquetes inventados por modelos; 53 (~42 %) todavía se podían registrar','No instales lo que el agente sugiere sin verificar']]},
note:'El estudio de slopsquatting (CSO Online, 2026) no está revisado por pares. Los otros tres tienen informes técnicos o análisis públicos.',
n:{g:'Contá los cuatro casos en una línea cada uno y dejá que el grupo diga qué pata de la trifecta faltaba cortar en cada uno. No hace falta dramatizar.\n\nDe los cuatro, el de Nx es el más cercano a ellos: no fue un ataque a un agente sino a una dependencia que, al correr, usó las herramientas de IA que ya estaban instaladas en la máquina del desarrollador.',c:'Estos son los hechos que sostenemos: (1) Invariant Labs describió en mayo de 2025 una vulnerabilidad en flujos con el MCP de GitHub; (2) Simon Willison analizó en julio de 2025 el caso de Supabase MCP como ejemplo de trifecta; (3) el incidente de Nx del 26 de agosto de 2025 está documentado por el propio proyecto y por Wiz, que informó 2.180 cuentas y 7.200 repositorios; (4) el estudio de slopsquatting reportado por CSO Online es preliminar. No usamos cifras del incidente de Replit por no estar verificadas.',s:[['Invariant Labs · GitHub MCP','https://invariantlabs.ai/blog/mcp-github-vulnerability'],['Simon Willison · Supabase MCP','https://simonwillison.net/2025/Jul/6/supabase-mcp-lethal-trifecta/'],['Nx · Postmortem s1ngularity','https://nx.dev/blog/s1ngularity-postmortem'],['Wiz · s1ngularity','https://www.wiz.io/blog/s1ngularity-supply-chain-attack']]}};};
